name: Dump Exasol logs
description: >
  Failure diagnostics shared by every E2E job: host dmesg, the stack's
  service logs, exasql crash logs, and the /exa/logs tree as an artifact.
  Callers must guard the step with `if: failure()`.
inputs:
  stack:
    description: The stack that scripts/e2e-stack.sh started, such as `e2e` or `lakekeeper`.
    required: true
  artifact-name:
    description: Name of the uploaded /exa/logs artifact, unique within the run.
    required: true
runs:
  using: composite
  steps:
    # A UDF sandbox crash leaves empty DB-side logs; the reason is only in host dmesg.
    # The caller runs this only on failure, so no step may rely on the implicit `success()`.
    - name: Dump Exasol logs
      if: ${{ !cancelled() }}
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        LOG_DIR: ${{ inputs.artifact-name }}
      run: |
        echo "=== host free ==="
        free -m || true
        echo "=== HOST kernel ring buffer (sudo) ==="
        sudo dmesg --ctime | grep -iE 'exaudf|seccomp|segfault|trap|invalid opcode|illegal|sig(sys|ill|segv|abrt)|signal [0-9]|killed process|oom|audit.*denied' | tail -60 || true
        echo "--- last 40 kernel lines (fallback) ---"
        sudo dmesg --ctime | tail -40 || true
        make "$STACK-logs" || true
        # Compose finds the stack's containers by project, so the base file alone reaches `exasol`.
        echo "=== exasql crash logs ==="
        docker compose exec -T exasol sh -c 'find /exa/logs/cored -name "exasql.*" -type f 2>/dev/null | sort | xargs -I{} sh -c "echo === {} ===; tail -40 {}"' || true
        echo "=== collecting /exa/logs tree for artifact ==="
        rm -rf "$LOG_DIR" && mkdir -p "$LOG_DIR"
        docker compose cp exasol:/exa/logs "$LOG_DIR/" 2>/dev/null || true

    - name: Upload Exasol logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-name }}/
        if-no-files-found: ignore
