name: E2E setup
description: >
  Common preparation shared by the e2e, e2e-lakekeeper, e2e-unity, e2e-azure and e2e-glue jobs.
  Callers must run `actions/checkout` themselves before this action.
runs:
  using: composite
  steps:
    # Must precede the cache restore: restoring onto a tight runner disk can ENOSPC (#121).
    - name: Free disk space
      shell: bash
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

    - name: Install Rust 1.98.1
      uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1 branch (toolchain 1.98.1 baked into action.yml)

    # Keeps the rust-cache key stable across runner image drift (#133).
    - name: Drop the runner's preinstalled Rust (stabilize cache key)
      shell: bash
      run: rustup toolchain list | awk '{print $1}' | grep -v '1\.98\.1' | xargs -r -n1 rustup toolchain uninstall

    # On a non-exact match rust-cache wipes target/release/, so the .so
    # download must stay after this step.
    - name: Restore cargo & build artifacts
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        shared-key: workspace-rlib
        save-if: "false"

    # The download's mtime is newer than the sources, so make treats the .so as current.
    - name: Download liblakehouse_engine.so
      uses: actions/download-artifact@v8
      with:
        name: lakehouse-engine-so-x86_64
        path: target/release/

    - name: Forbid make from rebuilding the .so
      shell: bash
      run: echo "REBUILD_SO=0" >> "$GITHUB_ENV"

    # Without this every UDF fails with "VM crashed" (22002): Exasol's nschroot
    # sandbox needs CAP_SYS_ADMIN in an unprivileged user namespace, which Ubuntu
    # 24.04's apparmor_restrict_unprivileged_userns=1 denies even when --privileged.
    - name: Allow unprivileged user namespaces (Exasol UDF sandbox)
      shell: bash
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        sysctl kernel.apparmor_restrict_unprivileged_userns
