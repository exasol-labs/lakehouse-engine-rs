name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # ready_for_review so CI fires when a draft is marked ready (the draft
    # guard on the root jobs skips draft-PR runs).
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue: required checks MUST run on merge_group or queued PRs hang
  # forever waiting for a status that never reports.
  merge_group:
  workflow_dispatch:

# Cancel a superseded run when a PR branch gets a new push (saves CI minutes,
# avoids two runs racing on the same branch's cache). Never cancel a main-push
# or tag-push run mid-flight — release() depends on that exact run's e2e job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"

jobs:
  # ── the real release artifact ─────────────────────────────────────────────
  # Built the same way a developer does: inside rust:1.94-bookworm (glibc
  # 2.36), matching the SLC. Never `cargo build --release` on the runner
  # directly — Ubuntu's glibc is newer and the .so fails to dlopen in Exasol.
  build-so:
    name: Build release .so (Docker)
    runs-on: ubuntu-latest
    # Skip draft PRs; still run on push/merge_group (where pull_request is null).
    # e2e / e2e-lakekeeper / e2e-azure cascade-skip via `needs: [build-so]`.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Observed cold-cache duration: ~33 min (full DataFusion/Arrow/Iceberg
    # release build). 60 min is a safety backstop against a genuine hang, not
    # a tight budget.
    timeout-minutes: 60
    steps:
      # A cold release build of the full DataFusion/Arrow/Iceberg tree plus a
      # cached target/ restore can exhaust the ~21 GB default runner disk — the
      # same ENOSPC class that killed lint/unit-tests. Reclaim ~12 GB up front.
      # (Latent until now because CI has only hit the warm path; a Cargo.lock
      # bump forces the cold path.)
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - uses: actions/checkout@v7

      # This build runs INSIDE rust:1.94-bookworm with its cargo home at
      # /usr/local/cargo, so Swatinem/rust-cache (host-side, prunes via the host
      # cargo) can't manage it — we stay on actions/cache.
      #
      # UDF_CARGO_VOL defaults to a *named* Docker volume in the Makefile
      # (fine on a persistent dev machine); override it to a host path here so
      # actions/cache can persist the Docker-side cargo registry across runs.
      # Also cache target/ itself (compiled artifacts) — caching only the
      # registry saves download time but not compile time, since the .so's
      # own target/ dir is otherwise empty on every fresh checkout. Cargo's
      # fingerprint check falls back to content hashes (not just mtimes) when
      # deciding what's stale, so it tolerates checkout resetting mtimes.
      #
      # restore-keys is what keeps a Cargo.lock bump from triggering a full
      # ~33-min cold build: on a lockfile change the exact key misses, but the
      # `docker-cargo-` prefix restores the most recent prior cache, so cargo
      # recompiles only the changed crates instead of the whole dep graph.
      #
      # Split restore/save so only main writes. Caches are branch-scoped, so PR
      # branches were each minting an exact-key copy — 12 of them, 7.5 GB
      # against a 10 GB quota — even though the `docker-cargo-` prefix fallback
      # already makes main's entry usable from any branch.
      - name: Restore Docker-side cargo registry and target/
        id: docker-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo-docker-registry
            target/
          # .cargo/config.toml is in the key for the same reason rust-cache
          # hashes it (see that file): a future [profile.release] edit there
          # would change every release fingerprint without moving Cargo.lock —
          # exact hit, save skipped, permanently poisoned. The prefix fallback
          # keeps unrelated (e.g. dev-profile) edits warm; cost is one
          # redundant re-save on main per config edit.
          key: docker-cargo-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            docker-cargo-

      - name: Build liblakehouse_engine.so
        run: make cross-musl-udf-build UDF_CARGO_VOL="$HOME/.cargo-docker-registry"

      # `docker run` writes into both the bind-mounted registry and target/ as
      # root (the container's default user), so actions/cache's post-job tar
      # (running as the runner user) can't read those files back out —
      # observed as "Cannot open: Permission denied" / cache save failing
      # silently.
      - name: Fix Docker-side build output ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo-docker-registry" target/

      # Main only (see the restore step), and only on an exact-key miss — keys
      # are immutable, so re-saving a hit is a wasted multi-GB upload.
      - name: Save Docker-side cargo registry and target/
        if: github.ref == 'refs/heads/main' && steps.docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo-docker-registry
            target/
          key: docker-cargo-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}

      - name: Upload liblakehouse_engine.so
        uses: actions/upload-artifact@v7
        with:
          name: lakehouse-engine-so
          path: target/release/liblakehouse_engine.so

  # ── fan-out: build-host / lint / unit-tests / licenses, all at t=0 ───────
  # Nothing here waits on build-so (different toolchain: host vs the
  # rust:1.94-bookworm container). `build-host` writes the `workspace-rlib`
  # cache that `lint` and the three e2e jobs read; `unit-tests` writes the
  # separate `llvm-cov` namespace (see both jobs' cache steps).
  #
  # SOLE writer of the `workspace-rlib` cache, for `lint` and the three e2e
  # jobs. `unit-tests` can no longer be: `cargo llvm-cov` builds into
  # target/llvm-cov-target and cleans every workspace member on every run.
  #
  # No `needs` anywhere in this fan-out, so readers restore BEFORE this job's
  # post-step saves — it serves the NEXT main run, exactly as `unit-tests`
  # did.
  #
  # MUST stay `cargo test`-shaped: clippy would save an .rmeta-only dep tree
  # and every reader needing codegen would rebuild. `--no-run` because
  # `unit-tests` is the test gate.
  build-host:
    name: Build Host Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)

      # Required: this job is a rust-cache writer (#133 — see `lint`).
      - name: Drop the runner's preinstalled Rust (stabilize cache key)
        run: rustup toolchain list | awk '{print $1}' | grep -v '1\.94' | xargs -r -n1 rustup toolchain uninstall

      # rust-cache, not actions/cache: it PRUNES target/ before saving.
      # Profile edits are keyed via .cargo/config.toml (see that file).
      # save-if gates writes to main against the repo's 10 GB quota.
      - name: Cache cargo & build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-rlib
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile workspace test targets
        run: cargo test --workspace --no-run

  lint:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      # Same rationale as build-so: reclaim ~12 GB before restoring the
      # shared cache and compiling on top of it, so clippy's --all-targets pass
      # doesn't ENOSPC on the ~21 GB default runner disk.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)
        with:
          components: clippy, rustfmt

      # dtolnay/rust-toolchain's `components:` doesn't reliably provision
      # rustfmt/clippy for every toolchain snapshot (observed: "'cargo-fmt' is
      # not installed for the toolchain '1.94-x86_64-unknown-linux-gnu'") —
      # same fix exasol-labs/language-container-rs's CI already needed.
      - name: Ensure rustfmt/clippy available on 1.94
        run: rustup component add rustfmt clippy --toolchain 1.94

      # rust-cache keys on every installed toolchain's `rustc -vV`, including
      # the runner image's preinstalled stable Rust — which drifts across the
      # heterogeneous hosted-runner image pool and has nothing to do with this
      # repo's pinned 1.94 (rust-toolchain.toml). A writer/reader landing on
      # different preinstalled versions silently diverges the cache key and
      # forces a full cold recompile in every reader job (#133). Drop
      # everything but 1.94 so the key only reflects the toolchain actually
      # used to compile.
      - name: Drop the runner's preinstalled Rust (stabilize cache key)
        run: rustup toolchain list | awk '{print $1}' | grep -v '1\.94' | xargs -r -n1 rustup toolchain uninstall

      # Read-only restore of the cache `build-host` writes; save-if:false so
      # readers never race to save their own copy. Keep the inputs identical
      # across every workspace-rlib rust-cache step — a divergence leaves
      # readers permanently cold (#133).
      - name: Restore cargo & build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-rlib
          save-if: "false"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The test gate, and the only job that executes the suite. Produces the
  # lcov report the `sonar` job uploads.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Backstop, not a budget: the cold cost is dominated by the
    # UNinstrumented dependency tree (~12 min, #133) — cargo-llvm-cov
    # instruments workspace members only.
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)
        with:
          components: llvm-tools-preview

      # `components:` above is not reliable on this toolchain snapshot — same
      # workaround the `lint` job carries for rustfmt/clippy.
      - name: Ensure llvm-tools-preview available on 1.94
        run: rustup component add llvm-tools-preview --toolchain 1.94

      # Still a rust-cache writer, just in another namespace (#133 — see `lint`).
      - name: Drop the runner's preinstalled Rust (stabilize cache key)
        run: rustup toolchain list | awk '{print $1}' | grep -v '1\.94' | xargs -r -n1 rustup toolchain uninstall

      # SOLE writer of the llvm-cov namespace. The DISTINCT shared-key is the
      # only thing separating this tree from workspace-rlib: the coverage
      # environment lives on cargo-llvm-cov's child process and never reaches
      # the key, which rust-cache hashes from its OWN env at restore time.
      #
      # rust-cache, not actions/cache: it hashes every toolchain's `rustc -vV`
      # into the key (a hand-rolled Cargo.lock key would hit exactly on a
      # toolchain bump, reject every artifact, and skip the save — poisoned
      # with no prefix-rotation escape); it recurses into the nested
      # target/llvm-cov-target when pruning, so the tree can't grow
      # monotonically; and it caches ~/.cargo/registry + git.
      #
      # cache-on-failure: this writer IS the test gate, so without it a red
      # test discards a dependency build that compiled fine and the next PR
      # pays a cold instrumented build inside a required check.
      - name: Cache cargo & instrumented build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: llvm-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"

      # Version-pinned like cargo-deny/cargo-about, and load-bearing: the "no
      # lcov post-processing needed" conclusion rests on 0.8.7's DEFAULT
      # --ignore-filename-regex set, which already excludes *_tests.rs.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-llvm-cov@0.8.7

      # Keep flag-identical to the Makefile's `coverage` target; this step is
      # the authority. exasol-e2e, cloud-e2e, lakekeeper-e2e and azure-e2e are
      # opt-in features, off by default, so this compiles none of them and
      # never touches a live stack or a cloud account.
      #
      # Doctests are NOT run (`--doctests` is unstable); zero cost today since
      # no crate has an executable doc test.
      - name: Run unit tests with coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov-unit.info

      # No `if: always()`: cargo llvm-cov exits non-zero and writes no report
      # when a test fails, so an always-run upload would add a second red step
      # burying the real one. `--ignore-run-fail` is not the fix — it exits 0
      # on test failure and would silently disable the gate.
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: lcov-unit
          path: lcov-unit.info
          if-no-files-found: error
          retention-days: 1

  # ── coverage + static analysis to SonarQube Cloud ────────────────────────
  # Deliberately NOT in `release`'s or the e2e jobs' `needs`, so a Sonar
  # outage cannot block the release path.
  #
  # RUNNER COUPLING: cargo-llvm-cov emits ABSOLUTE `SF:` paths, so coverage
  # resolves across the job boundary only because `unit-tests` and this job
  # are both bare ubuntu-latest runners with an identical $GITHUB_WORKSPACE.
  # Moving `unit-tests` into a container or onto a self-hosted runner makes
  # Sonar report 0% coverage with only a warning; the fix would be
  # `sed -i "s|$GITHUB_WORKSPACE/||g" lcov-unit.info` before upload.
  sonar:
    name: Sonar Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests]
    # Fork PRs receive no repository secrets, so an unguarded scan fails on an
    # empty token. merge_group is skipped too: it would analyse a throwaway
    # gh-readonly-queue/* branch and put a third-party service inside the
    # merge path (sonar.qualitygate.wait=true). Revisit only if
    # `Sonar Analysis` becomes a required check.
    if: >-
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      # fetch-depth: 0 — shallow clones degrade Sonar's blame-based issue
      # assignment.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: lcov-unit

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  licenses:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)

      # Deliberately NOT caching ~/.cargo/registry: it saved ~9s on a sub-minute
      # job while holding 2 GB of the repo's 10 GB quota and evicting caches
      # that matter. Without it `cargo deny`'s `cargo metadata` re-downloads the
      # index and this job grows to ~2–3 min — off the critical path, so leave
      # it. Don't "fix" this back.
      - name: Install cargo-deny
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-deny@0.19.9

      # MIT-compliance gate: every third-party dependency must carry a license
      # from deny.toml's allow-list; keep that list in sync with about.toml's
      # `accepted` list (both files cross-reference each other).
      - name: Check licenses and advisories
        run: cargo deny check licenses advisories

  # ── install script: static checks + stubbed unit tests, no network ──────
  # deploy/scripts/install.sh is fetched straight off `main` by every user's
  # `curl | bash` one-liner (see docs/install.md) — there is no release gate
  # between a merge and that fetch, so this job (and install-script-e2e below)
  # must both be required checks AND block `release` (see release.needs).
  install-script:
    name: Install Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck -s bash deploy/scripts/install.sh deploy/scripts/tests/install.test.sh

      - name: Unit tests (stubbed exapump/curl, no network)
        run: make test-install

  # ── install script: real end-to-end run against a live BucketFS Exasol ──
  # Proves the BucketFS target (Exasol AsApp/Docker/on-premise all speak the same
  # BucketFS HTTP interface) against a REAL Exasol, using a REAL prior
  # release fetched through the authenticated GitHub API — exactly what a
  # user's one-liner does. Does not depend on build-so / this PR's own .so:
  # this job tests the INSTALLER's mechanics (exapump bucketfs upload, DDL,
  # SCRIPT_LANGUAGES registration, fingerprint smoke test), not query
  # correctness — that's already covered by `e2e` / `e2e-lakekeeper`.
  # ponytail: only the `exasol` compose service is started (no MinIO/Iceberg
  # REST/Spark fixtures) — this job never queries a Virtual Schema, so it
  # doesn't need catalog/object-storage services. SaaS mode has no CI job:
  # it needs a real SaaS tenant + PAT that CI doesn't have (tracked in #252).
  install-script-e2e:
    name: Install Script E2E (BucketFS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - uses: actions/checkout@v7

      - name: Pull Exasol image
        run: docker compose pull --quiet exasol

      # Same root cause and fix as the `e2e` job: register_slc/create_engine_scripts
      # spawn real Exasol UDF sandboxes (LAKEHOUSE_ADAPTER / LAKEHOUSE_SCAN).
      - name: Allow unprivileged user namespaces (Exasol UDF sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl kernel.apparmor_restrict_unprivileged_userns

      - name: Start stack (Exasol only)
        run: docker compose up -d --wait exasol

      - name: Install exapump
        run: curl -fsSL https://raw.githubusercontent.com/exasol-labs/exapump/main/install.sh | sh

      # Fresh container, so no exapump profile exists yet. Same BucketFS
      # write-password extraction the Makefile's install-slc/bucketfs-upload-so
      # targets already use — read straight out of EXAConf, no manual secret.
      - name: Create exapump profile for the compose stack
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          BFSPASS=$(docker exec lakehouse-engine-rs-exasol-1 bash -c \
            "awk '/\[\[Bucket.*default\]\]/{f=1} f&&/WritePasswd/{print \$3;exit}' /exa/etc/EXAConf | base64 -d")
          exapump profile add ci-bucketfs \
            --host localhost --port "${LH_EXASOL_PORT:-28563}" \
            --user sys --password "${EXASOL_SYS_PASSWORD:-exasol}" \
            --validate-certificate false \
            --bfs-host localhost --bfs-port "${LH_BUCKETFS_PORT:-22581}" \
            --bfs-write-password "$BFSPASS" \
            --default

      # No --lakehouse-version/--slc-version pin: fetches each repo's latest
      # release, same as a real user's default invocation. GITHUB_TOKEN is the
      # standard Actions-provided token — it already has read access to this
      # (private) repo's own releases, and language-container-rs is public.
      - name: Run install.sh (BucketFS target)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/scripts/install.sh --profile ci-bucketfs

      - name: Dump Exasol logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs exasol | tail -150 || true

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ── viability gate: full local Exasol + MinIO + Iceberg-REST stack ───────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # build-so only — its .so artifact is all this job consumes. NOT also
    # depending on lint/unit-tests/licenses trades away ~18 min of fail-fast
    # serialization: all three are separately-required checks (ruleset + merge
    # queue), so any red one blocks the merge on its own — e2e needn't wait on
    # them to keep broken code off main.
    # Trade: a PR with a clippy error still burns a full E2E run; revert by
    # re-adding to `needs`. `release` lists them explicitly so main still can't
    # ship broken.
    needs: [build-so]
    # Observed 16-20 min end-to-end historically, but pre-test setup (disk
    # cleanup + image loads) has grown slower as the hosted runner image
    # bundles more pre-installed content to prune through — one run burned
    # ~22 min on setup alone and got killed mid-suite at the old 30 min cap.
    # 45 min is a safety backstop against a genuine hang, not a tight budget
    # (same rationale as build-so's timeout).
    timeout-minutes: 45
    env:
      # Standard GitHub-hosted runners have 2 vCPUs; docker-compose.yml's
      # exasol service default (4) exceeds what Docker will accept ("range of
      # CPUs is from 0.01 to 2.00, as there are only 2 CPUs available").
      LH_EXASOL_CPUS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup

      # No tarball cache here (tried it, dropped it): restoring a GHA cache
      # tarball and `docker load`-ing it is a wash against a direct registry
      # pull — same order of magnitude either way — but caching forced these
      # into per-image sequential steps. `docker compose pull` fetches every
      # service's image (Exasol, MinIO, Iceberg REST, Spark, minio-init's mc)
      # concurrently, so the pulls overlap instead of queueing one after another.
      # --quiet: without it, compose interleaves a live-updating progress bar
      # per image per layer, which flattens into a huge wall of duplicate
      # lines in the non-interactive CI log. Errors and image names still print.
      - name: Pull stack images
        run: docker compose pull --quiet

      # Two-phase: `docker compose up --wait` doesn't reliably support a
      # one-shot container (minio-init) in the same wait set as long-running
      # services — even a clean exit(0) trips it into exit code 1 (confirmed:
      # every service was healthy, --wait still failed). `docker wait` the
      # init job to completion first, then --wait only the services that stay
      # running.
      - name: Start stack (Exasol + MinIO + Iceberg REST)
        run: |
          docker compose up -d minio-init
          # `docker wait` itself always exits 0 (it successfully waited); the
          # container's actual exit code is its stdout — check it explicitly.
          INIT_EXIT=$(docker wait lakehouse-engine-rs-minio-init-1)
          if [ "$INIT_EXIT" != "0" ]; then
            echo "::error::minio-init exited $INIT_EXIT (bucket creation failed)"
            docker compose logs minio-init
            exit 1
          fi
          docker compose up -d --wait exasol minio iceberg-rest

          # spark-iceberg-fixtures is a second one-shot job (same rationale as
          # minio-init above): it authors the positional-delete E2E fixtures
          # by running Apache Spark once, then exits — so it's waited on with
          # `docker wait`, not folded into the --wait set above.
          docker compose up -d spark-iceberg-fixtures
          SPARK_FIXTURES_EXIT=$(docker wait lakehouse-engine-rs-spark-iceberg-fixtures-1)
          if [ "$SPARK_FIXTURES_EXIT" != "0" ]; then
            echo "::error::spark-iceberg-fixtures exited $SPARK_FIXTURES_EXIT (positional-delete fixture authoring failed)"
            docker compose logs spark-iceberg-fixtures
            exit 1
          fi

      # SLC download, BucketFS upload, and VS creation all happen in-process
      # inside the Rust test harness (crates/lakehouse-engine/tests/e2e_scan_test.rs
      # setup_e2e), so no separate install-slc/exapump step is needed here.
      - name: Run E2E suite
        run: make test-e2e

      # A UDF sandbox crash produces zero-byte DB-side logs; the real reason
      # only shows up in the host kernel ring buffer (dmesg), which needs sudo.
      - name: Dump Exasol logs on failure
        if: failure()
        run: |
          echo "=== container stats / host free ==="
          docker compose ps || true
          free -m || true
          echo "=== HOST kernel ring buffer (sudo) ==="
          sudo dmesg --ctime | grep -iE 'exaudf|seccomp|segfault|trap|invalid opcode|illegal|sig(sys|ill|segv|abrt)|signal [0-9]|killed process|oom|audit.*denied' | tail -60 || true
          echo "--- last 40 kernel lines (fallback) ---"
          sudo dmesg --ctime | tail -40 || true
          echo "=== exasql crash logs ==="
          docker compose exec -T exasol sh -c 'find /exa/logs/cored -name "exasql.*" -type f 2>/dev/null | sort | xargs -I{} sh -c "echo === {} ===; tail -40 {}"' || true
          echo "=== collecting /exa/logs tree for artifact ==="
          rm -rf exa-logs && mkdir -p exa-logs
          docker compose cp exasol:/exa/logs exa-logs/ 2>/dev/null || true

      - name: Upload Exasol logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exa-logs
          path: exa-logs/
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ── second viability gate: Lakekeeper (OIDC/Keycloak + MinIO STS) overlay ─
  # Mirrors the `e2e` job's setup steps; the compose overlay adds Keycloak +
  # Lakekeeper + its Postgres backend on top of the base stack (reuses base
  # `minio` and `exasol`). Independent of `e2e` (same upstream `needs`, no
  # dependency between the two) so they run in parallel; gates `release`
  # alongside `e2e` (see the `release` job's `needs`).
  e2e-lakekeeper:
    name: E2E (Lakekeeper)
    runs-on: ubuntu-latest
    # See `e2e`'s identical `needs` and its rationale.
    needs: [build-so]
    # This stack's own healthchecks (docker-compose.lakekeeper.yml) already
    # bound each service's time-to-healthy (interval × retries + start_period);
    # this is the wall-clock backstop for the whole job, same rationale as
    # `e2e`'s timeout-minutes — a hang here should surface as a clear CI
    # failure, not a long silent one. The Lakekeeper stack has one fewer
    # one-shot fixture job than `e2e` (no Spark fixtures), so 45 min matches
    # `e2e`'s budget rather than needing more.
    timeout-minutes: 45
    env:
      # See the `e2e` job's identical override — same 2-vCPU hosted-runner cap.
      LH_EXASOL_CPUS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup

      - name: Pull stack images
        run: docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml pull --quiet

      # Four-phase bring-up, same rationale as the `e2e` job's two-phase one:
      # `docker compose up --wait` doesn't reliably support a one-shot
      # container in the same wait set as long-running services, so every
      # one-shot job here (minio-init, minio-lakekeeper-init,
      # lakekeeper-migrate) is `docker wait`-ed to completion individually
      # before the long-running services are brought up with `--wait`. By the
      # time the last phase runs, lakekeeper-migrate has already completed, so
      # `lakekeeper`'s `service_completed_successfully` dependency on it is
      # already satisfied — only the still-running services need `--wait`.
      - name: Start stack (Exasol + MinIO + Keycloak + Lakekeeper)
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml"

          $COMPOSE up -d minio-init
          INIT_EXIT=$(docker wait lakehouse-engine-rs-minio-init-1)
          if [ "$INIT_EXIT" != "0" ]; then
            echo "::error::minio-init exited $INIT_EXIT (bucket creation failed)"
            $COMPOSE logs minio-init
            exit 1
          fi

          $COMPOSE up -d minio-lakekeeper-init
          STS_INIT_EXIT=$(docker wait lakehouse-engine-rs-minio-lakekeeper-init-1)
          if [ "$STS_INIT_EXIT" != "0" ]; then
            echo "::error::minio-lakekeeper-init exited $STS_INIT_EXIT (STS user/policy setup failed)"
            $COMPOSE logs minio-lakekeeper-init
            exit 1
          fi

          $COMPOSE up -d lakekeeper-migrate
          MIGRATE_EXIT=$(docker wait lakehouse-engine-rs-lakekeeper-migrate-1)
          if [ "$MIGRATE_EXIT" != "0" ]; then
            echo "::error::lakekeeper-migrate exited $MIGRATE_EXIT (schema migration failed)"
            $COMPOSE logs lakekeeper-migrate
            exit 1
          fi

          $COMPOSE up -d --wait exasol minio keycloak lakekeeper-db lakekeeper

      - name: Run Lakekeeper E2E suite
        run: make test-e2e-lakekeeper

      # Same rationale as the `e2e` job's identical step: a UDF sandbox crash
      # only shows up in the host kernel ring buffer, not DB-side logs.
      - name: Dump Lakekeeper stack logs on failure
        if: failure()
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml"
          echo "=== container stats / host free ==="
          $COMPOSE ps || true
          free -m || true
          echo "=== HOST kernel ring buffer (sudo) ==="
          sudo dmesg --ctime | grep -iE 'exaudf|seccomp|segfault|trap|invalid opcode|illegal|sig(sys|ill|segv|abrt)|signal [0-9]|killed process|oom|audit.*denied' | tail -60 || true
          echo "--- last 40 kernel lines (fallback) ---"
          sudo dmesg --ctime | tail -40 || true
          echo "=== keycloak logs ==="
          $COMPOSE logs keycloak | tail -100 || true
          echo "=== lakekeeper-migrate logs ==="
          $COMPOSE logs lakekeeper-migrate | tail -100 || true
          echo "=== lakekeeper logs ==="
          $COMPOSE logs lakekeeper | tail -100 || true
          echo "=== exasql crash logs ==="
          $COMPOSE exec -T exasol sh -c 'find /exa/logs/cored -name "exasql.*" -type f 2>/dev/null | sort | xargs -I{} sh -c "echo === {} ===; tail -40 {}"' || true
          echo "=== collecting /exa/logs tree for artifact ==="
          rm -rf exa-logs-lakekeeper && mkdir -p exa-logs-lakekeeper
          $COMPOSE cp exasol:/exa/logs exa-logs-lakekeeper/ 2>/dev/null || true

      - name: Upload Lakekeeper Exasol logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exa-logs-lakekeeper
          path: exa-logs-lakekeeper/
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml down -v

  # ── third viability gate: REAL Azure ADLS Gen2 storage, local catalog ────
  # No local ADLS Gen2 substitute exists (Azurite's `dfs` endpoint is
  # incomplete), so this suite runs against a real Azure account; catalog
  # (Lakekeeper), OIDC (Keycloak), and Exasol stay local Docker, same overlay
  # as `e2e-lakekeeper`.
  #
  # Requires five repository secrets/vars (fails loudly naming any missing):
  #   vars.AZURE_STORAGE_ACCOUNT_NAME     data path, not a secret
  #   secrets.AZURE_STORAGE_ACCOUNT_KEY   the credential UNDER TEST
  #   secrets.AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
  #     service principal for container lifecycle only, never the scan itself
  # The service principal needs exactly Storage Blob Data Contributor — a
  # data-actions-only role 403s on container create/delete. Use a dedicated
  # test-only storage account.
  #
  # Not in `release`'s `needs`: a live third-party account there would let an
  # Azure incident or rotated secret block every release.
  e2e-azure:
    name: E2E (Azure)
    runs-on: ubuntu-latest
    # See `e2e`'s identical `needs` and its rationale.
    needs: [build-so]
    # Same backstop-not-budget rationale as `e2e` / `e2e-lakekeeper`; the extra
    # cost here is real-cloud round-trips, not extra local services.
    timeout-minutes: 45
    env:
      # See the `e2e` job's identical override — same 2-vCPU hosted-runner cap.
      LH_EXASOL_CPUS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup

      # Only the services this suite starts, unlike `e2e-lakekeeper`'s bare
      # `pull`: the Spark fixture and Iceberg-REST images are multi-GB and this
      # job never runs either. Anything missed would still be pulled by `up`.
      - name: Pull stack images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml \
            -f docker-compose.lakekeeper.azure.yml \
            pull --quiet exasol keycloak lakekeeper-db lakekeeper-migrate lakekeeper

      # Two-phase bring-up, same pattern as `e2e-lakekeeper`. Skips `minio-init` /
      # `minio-lakekeeper-init` (S3 bucket + STS setup this ADLS suite doesn't
      # use) and `minio` itself — docker-compose.lakekeeper.azure.yml.
      - name: Start stack (Exasol + Keycloak + Lakekeeper)
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml -f docker-compose.lakekeeper.azure.yml"

          $COMPOSE up -d lakekeeper-migrate
          MIGRATE_EXIT=$(docker wait lakehouse-engine-rs-lakekeeper-migrate-1)
          if [ "$MIGRATE_EXIT" != "0" ]; then
            echo "::error::lakekeeper-migrate exited $MIGRATE_EXIT (schema migration failed)"
            $COMPOSE logs lakekeeper-migrate
            exit 1
          fi

          $COMPOSE up -d --wait exasol keycloak lakekeeper-db lakekeeper

      # The five credential variables are scoped to THIS step only — no later
      # step (log dumping, artifact upload) has any use for them.
      - name: Run Azure E2E suite
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: make test-e2e-azure

      # Same rationale as the `e2e` job's identical step: a UDF sandbox crash
      # only shows up in the host kernel ring buffer, not DB-side logs.
      - name: Dump Azure stack logs on failure
        if: failure()
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml -f docker-compose.lakekeeper.azure.yml"
          echo "=== container stats / host free ==="
          $COMPOSE ps || true
          free -m || true
          echo "=== HOST kernel ring buffer (sudo) ==="
          sudo dmesg --ctime | grep -iE 'exaudf|seccomp|segfault|trap|invalid opcode|illegal|sig(sys|ill|segv|abrt)|signal [0-9]|killed process|oom|audit.*denied' | tail -60 || true
          echo "--- last 40 kernel lines (fallback) ---"
          sudo dmesg --ctime | tail -40 || true
          echo "=== keycloak logs ==="
          $COMPOSE logs keycloak | tail -100 || true
          echo "=== lakekeeper-migrate logs ==="
          $COMPOSE logs lakekeeper-migrate | tail -100 || true
          echo "=== lakekeeper logs ==="
          $COMPOSE logs lakekeeper | tail -100 || true
          echo "=== exasql crash logs ==="
          $COMPOSE exec -T exasol sh -c 'find /exa/logs/cored -name "exasql.*" -type f 2>/dev/null | sort | xargs -I{} sh -c "echo === {} ===; tail -40 {}"' || true
          echo "=== collecting /exa/logs tree for artifact ==="
          rm -rf exa-logs-azure && mkdir -p exa-logs-azure
          $COMPOSE cp exasol:/exa/logs exa-logs-azure/ 2>/dev/null || true

      # Distinct artifact name: upload-artifact@v7 rejects a name already used by
      # another job in the same run (`e2e` / `e2e-lakekeeper` own the other two).
      - name: Upload Azure Exasol logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exa-logs-azure
          path: exa-logs-azure/
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml -f docker-compose.lakekeeper.azure.yml down -v

  # ── release: main-push-with-version-bump, or a direct tag push ──────────
  release:
    name: Release
    runs-on: ubuntu-latest
    # lint/unit-tests/licenses listed EXPLICITLY, not inherited: they used to
    # gate this transitively through `e2e`'s `needs`. Now that e2e only needs
    # build-so, a main push with failing tests would otherwise mint a tag +
    # Release. No latency cost — the e2e jobs dominate the chain. install-script
    # and install-script-e2e are listed for the same reason: install.sh is
    # served straight off `main` (see its own job comment), so a broken script
    # on `main` must never reach a release-gated push either.
    #
    # `e2e-azure` is deliberately absent: a live third-party account there would
    # let an Azure incident or rotated secret block every release.
    needs: [e2e, e2e-lakekeeper, lint, unit-tests, licenses, install-script, install-script-e2e]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        run: |
          VER=$(grep -m1 '^version' crates/lakehouse-engine/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      # Verify the version trail, not just tag-existence: find the highest
      # existing vX.Y.Z tag and confirm this version is strictly greater
      # (semver). Stricter than an existence-only check, which would silently
      # let through a version edited downward or left unchanged as long as
      # that exact tag string didn't already exist.
      - name: Determine highest existing release tag
        id: prior
        run: |
          git fetch --tags --quiet
          HIGHEST=$(git tag -l 'v*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          echo "highest=${HIGHEST:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          HIGHEST: ${{ steps.prior.outputs.highest }}
        run: |
          # ponytail: numeric X.Y.Z only (no pre-release/build metadata) — this
          # project's versions are plain semver, so a full semver comparator
          # would be pure ceremony here.
          is_greater() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)" = "$1" ]
          }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tag-push path: the tag already exists by definition. Still
            # reject a regressed/duplicate version (e.g. an accidental re-tag
            # of an old release).
            if is_greater "$VERSION" "$HIGHEST" || [ "$VERSION" = "$HIGHEST" ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "Tag push for $TAG (version $VERSION) — releasing."
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::error::Tag $TAG (version $VERSION) is older than the highest existing release ($HIGHEST) — refusing to release."
              exit 1
            fi
          else
            # Main-push path: release only on a genuine forward version bump.
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already exists — version not bumped; nothing to release."
            elif is_greater "$VERSION" "$HIGHEST"; then
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "Version bumped to $VERSION (previous release: $HIGHEST) — releasing $TAG."
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::error::crates/lakehouse-engine/Cargo.toml version ($VERSION) is not greater than the highest existing release ($HIGHEST), and $TAG doesn't exist — this looks like a broken version bump on main."
              exit 1
            fi
          fi

      - name: Download liblakehouse_engine.so
        if: steps.gate.outputs.release == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lakehouse-engine-so

      # Manual-install users (e.g. Exasol SaaS, no BucketFS network access)
      # download this straight off the release page and PUT/UI-upload it
      # as-is — no local build, no repackaging. The `udf/` layout is what
      # BucketFS extracts the tarball into; chmod before archiving so the
      # extracted .so is already executable.
      - name: Package release tarball
        if: steps.gate.outputs.release == 'true'
        run: |
          mkdir -p pkg/udf
          cp liblakehouse_engine.so pkg/udf/
          chmod 755 pkg/udf/liblakehouse_engine.so
          tar -czf lakehouse-engine.tar.gz -C pkg udf

      - name: Install Rust 1.94
        if: steps.gate.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)

      - name: Install cargo-about
        if: steps.gate.outputs.release == 'true'
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-about@0.9.0

      # Third-party notices for the crate graph shipped in the .so. Never
      # committed (see .gitignore) — generated fresh for each release, kept in
      # sync with deny.toml's allow-list via the cross-referencing comments in
      # about.toml.
      - name: Generate third-party notices
        if: steps.gate.outputs.release == 'true'
        run: |
          cargo about generate \
            --manifest-path crates/lakehouse-engine/Cargo.toml \
            -c about.toml about.hbs -o THIRD-PARTY-LICENSES.md

      - name: Create and push tag
        if: steps.gate.outputs.release == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          # deploy/scripts/install.sh is deliberately NOT listed here. Users
          # fetch it from the contents API on `main` (docs/install.md), and
          # `?ref=<tag>` on that same API already covers pinning — a release
          # asset would instead freeze installer bugs into every past release
          # forever. Don't "fix" this by adding it back.
          files: |
            lakehouse-engine.tar.gz
            THIRD-PARTY-LICENSES.md
