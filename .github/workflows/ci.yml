name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # ready_for_review: draft PRs are skipped, so fire when one is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # Required checks MUST run on merge_group or queued PRs hang forever.
  merge_group:
  workflow_dispatch:

# Never cancel main/tag runs: `release` depends on that exact run's e2e jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"

jobs:
  # Built inside rust:1.94-trixie, never on the runner: the SDK fingerprint
  # embeds the rustc hash, so a host-built .so is rejected by the SLC.
  build-so:
    name: Build release .so (Docker, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Skips draft PRs; the e2e jobs cascade-skip via `needs: [build-so]`.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Cold build ~33 min; this is a hang backstop, not a budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7

      # actions/cache, not rust-cache: the build runs inside the container,
      # whose cargo home rust-cache can't manage. UDF_CARGO_VOL is a host path
      # so the registry persists. Only main saves, to stay within the 10 GB quota;
      # the prefix restore-key serves main's entry to every branch.
      - name: Restore Docker-side cargo registry and target/
        id: docker-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo-docker-registry
            target/
          # .cargo/config.toml: a profile edit must rotate the key (see that file).
          key: docker-cargo-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            docker-cargo-${{ matrix.arch }}-

      - name: Build liblakehouse_engine.so
        run: make cross-udf-build UDF_CARGO_VOL="$HOME/.cargo-docker-registry"

      # The container writes as root; the cache save runs as the runner user.
      - name: Fix Docker-side build output ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo-docker-registry" target/

      - name: Save Docker-side cargo registry and target/
        if: github.ref == 'refs/heads/main' && steps.docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo-docker-registry
            target/
          key: docker-cargo-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}

      - name: Upload liblakehouse_engine.so
        uses: actions/upload-artifact@v7
        with:
          name: lakehouse-engine-so-${{ matrix.arch }}
          path: target/release/liblakehouse_engine.so

  # SOLE writer of the `workspace-rlib` cache read by `lint` and the e2e jobs.
  # MUST stay `cargo test`-shaped: clippy would save an .rmeta-only dep tree
  # and every reader needing codegen would rebuild.
  build-host:
    name: Build Host Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)

      - name: Drop the runner's preinstalled Rust (stabilize cache key)
        run: rustup toolchain list | awk '{print $1}' | grep -v '1\.94' | xargs -r -n1 rustup toolchain uninstall

      - name: Cache cargo & build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-rlib
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile workspace test targets
        run: cargo test --workspace --no-run

  lint:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)
        with:
          components: clippy, rustfmt

      # `components:` above doesn't reliably provision these on every snapshot.
      - name: Ensure rustfmt/clippy available on 1.94
        run: rustup component add rustfmt clippy --toolchain 1.94

      # rust-cache keys on every installed toolchain, and the runner's
      # preinstalled Rust drifts across images, diverging writer/reader keys (#133).
      - name: Drop the runner's preinstalled Rust (stabilize cache key)
        run: rustup toolchain list | awk '{print $1}' | grep -v '1\.94' | xargs -r -n1 rustup toolchain uninstall

      # Keep inputs identical across every workspace-rlib step, or readers stay cold (#133).
      - name: Restore cargo & build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-rlib
          save-if: "false"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)
        with:
          components: llvm-tools-preview

      - name: Ensure llvm-tools-preview available on 1.94
        run: rustup component add llvm-tools-preview --toolchain 1.94

      - name: Drop the runner's preinstalled Rust (stabilize cache key)
        run: rustup toolchain list | awk '{print $1}' | grep -v '1\.94' | xargs -r -n1 rustup toolchain uninstall

      # The distinct shared-key is the only thing separating this tree from
      # workspace-rlib: the coverage env never reaches rust-cache's key.
      # cache-on-failure: a red test must not discard a good dependency build.
      - name: Cache cargo & instrumented build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: llvm-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"

      # Pin is load-bearing: 0.8.7's default --ignore-filename-regex excludes *_tests.rs.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-llvm-cov@0.8.7

      # Keep flag-identical to the Makefile's `coverage` target; this step is the authority.
      - name: Run unit tests with coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov-unit.info

      # No `if: always()`: a failed run writes no report. Don't use
      # `--ignore-run-fail` either — it would silently disable the gate.
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: lcov-unit
          path: lcov-unit.info
          if-no-files-found: error
          retention-days: 1

  # Deliberately not in `release`'s needs, so a Sonar outage can't block releases.
  # lcov `SF:` paths are absolute: `unit-tests` must share this job's
  # $GITHUB_WORKSPACE, or Sonar silently reports 0% coverage.
  sonar:
    name: Sonar Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests]
    # Fork PRs get no secrets; merge_group would put Sonar inside the merge path.
    if: >-
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      # Shallow clones degrade Sonar's blame-based issue assignment.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: lcov-unit

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  arm64:
    name: Unit Tests (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)

      - name: Drop the runner's preinstalled Rust (stabilize cache key)
        run: rustup toolchain list | awk '{print $1}' | grep -v '1\.94' | xargs -r -n1 rustup toolchain uninstall

      # rust-cache embeds the platform in the key and ignores `key:` with `shared-key`.
      - name: Cache cargo & build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run unit tests
        run: cargo test --workspace

  licenses:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)

      # Deliberately uncached: a registry cache costs 2 GB of the 10 GB quota for ~9s.
      - name: Install cargo-deny
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-deny@0.19.9

      - name: Check licenses and advisories
        run: cargo deny check licenses advisories

  # install.sh is fetched straight off `main` by the curl|bash one-liner, so
  # this job and install-script-e2e must be required checks AND gate `release`.
  install-script:
    name: Install Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck -s bash deploy/scripts/install.sh deploy/scripts/tests/install.test.sh

      - name: Unit tests (stubbed exapump/curl, no network)
        run: make test-install

  # Tests the installer against a real prior release on a runner with no
  # prereqs preinstalled, not this PR's .so. SaaS mode has no CI job (#252).
  install-script-e2e:
    name: Install Script E2E (BucketFS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Pull Exasol image
        run: docker compose pull --quiet exasol

      # See .github/actions/e2e-setup: the SLC install and LAKEHOUSE_VERSION smoke test
      # spawn UDF sandboxes, which need this on Ubuntu 24.04.
      - name: Allow unprivileged user namespaces (Exasol UDF sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl kernel.apparmor_restrict_unprivileged_userns

      - name: Start stack (Exasol only)
        run: docker compose up -d --wait exasol

      # Deliberately no exapump install or profile: this proves install.sh's
      # auto-install, and a profile would need exapump already installed.
      - name: Run install.sh (BucketFS target, exapump not preinstalled)
        run: |
          BFSPASS=$(docker exec lakehouse-engine-rs-exasol-1 bash -c \
            "awk '/\[\[Bucket.*default\]\]/{f=1} f&&/WritePasswd/{print \$3;exit}' /exa/etc/EXAConf | base64 -d")
          bash deploy/scripts/install.sh \
            --host "localhost:${LH_EXASOL_PORT:-28563}" --user sys --password "${EXASOL_SYS_PASSWORD:-exasol}" \
            --bfs-host localhost --bfs-port "${LH_BUCKETFS_PORT:-22581}" \
            --bfs-write-password "$BFSPASS"

      - name: Dump Exasol logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs exasol | tail -150 || true

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # `name:` comes from the matrix so the 2025.x leg keeps the exact required
  # check name `E2E`. The 8.29.x leg is not yet in the ruleset (#364).
  e2e:
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-latest
    # build-so only: lint/unit-tests/licenses are separately required, and
    # `release` lists them explicitly.
    needs: [build-so]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: exasol/docker-db:2025.1.16
            check_name: E2E
            log_artifact: exa-logs
          - image: exasol/docker-db:8.29.13
            check_name: E2E (8.29.x)
            log_artifact: exa-logs-8x
    timeout-minutes: 45
    env:
      EXASOL_IMAGE: ${{ matrix.image }}
      # `adapter_detects_container_cpuset` needs fewer CPUs than the runner has.
      LH_EXASOL_CPUSET: "0-1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup

      - name: Pull stack images
        run: docker compose pull --quiet

      # `up --wait` fails on a one-shot container even after a clean exit, so
      # one-shot jobs are `docker wait`-ed first.
      - name: Start stack (Exasol + MinIO + Iceberg REST)
        run: |
          docker compose up -d minio-init
          # `docker wait` prints the container's exit code; it always exits 0 itself.
          INIT_EXIT=$(docker wait lakehouse-engine-rs-minio-init-1)
          if [ "$INIT_EXIT" != "0" ]; then
            echo "::error::minio-init exited $INIT_EXIT (bucket creation failed)"
            docker compose logs minio-init
            exit 1
          fi
          docker compose up -d --wait exasol minio iceberg-rest

          docker compose up -d spark-iceberg-fixtures
          SPARK_FIXTURES_EXIT=$(docker wait lakehouse-engine-rs-spark-iceberg-fixtures-1)
          if [ "$SPARK_FIXTURES_EXIT" != "0" ]; then
            echo "::error::spark-iceberg-fixtures exited $SPARK_FIXTURES_EXIT (positional-delete fixture authoring failed)"
            docker compose logs spark-iceberg-fixtures
            exit 1
          fi

      - name: Run E2E suite
        run: make test-e2e

      # A UDF sandbox crash leaves empty DB-side logs; the reason is only in host dmesg.
      - name: Dump Exasol logs on failure
        if: failure()
        run: |
          echo "=== container stats / host free ==="
          docker compose ps || true
          free -m || true
          echo "=== HOST kernel ring buffer (sudo) ==="
          sudo dmesg --ctime | grep -iE 'exaudf|seccomp|segfault|trap|invalid opcode|illegal|sig(sys|ill|segv|abrt)|signal [0-9]|killed process|oom|audit.*denied' | tail -60 || true
          echo "--- last 40 kernel lines (fallback) ---"
          sudo dmesg --ctime | tail -40 || true
          echo "=== exasql crash logs ==="
          docker compose exec -T exasol sh -c 'find /exa/logs/cored -name "exasql.*" -type f 2>/dev/null | sort | xargs -I{} sh -c "echo === {} ===; tail -40 {}"' || true
          echo "=== collecting /exa/logs tree for artifact ==="
          rm -rf exa-logs && mkdir -p exa-logs
          docker compose cp exasol:/exa/logs exa-logs/ 2>/dev/null || true

      - name: Upload Exasol logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # upload-artifact@v7 rejects a name reused within one run.
          name: ${{ matrix.log_artifact }}
          path: exa-logs/
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose down -v

  e2e-lakekeeper:
    name: E2E (Lakekeeper)
    runs-on: ubuntu-latest
    needs: [build-so]
    timeout-minutes: 45
    env:
      LH_EXASOL_CPUSET: "0-1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup

      - name: Pull stack images
        run: docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml pull --quiet

      # One-shot jobs are `docker wait`-ed first (see `e2e`).
      - name: Start stack (Exasol + MinIO + Keycloak + Lakekeeper)
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml"

          $COMPOSE up -d minio-init
          INIT_EXIT=$(docker wait lakehouse-engine-rs-minio-init-1)
          if [ "$INIT_EXIT" != "0" ]; then
            echo "::error::minio-init exited $INIT_EXIT (bucket creation failed)"
            $COMPOSE logs minio-init
            exit 1
          fi

          $COMPOSE up -d minio-lakekeeper-init
          STS_INIT_EXIT=$(docker wait lakehouse-engine-rs-minio-lakekeeper-init-1)
          if [ "$STS_INIT_EXIT" != "0" ]; then
            echo "::error::minio-lakekeeper-init exited $STS_INIT_EXIT (STS user/policy setup failed)"
            $COMPOSE logs minio-lakekeeper-init
            exit 1
          fi

          $COMPOSE up -d lakekeeper-migrate
          MIGRATE_EXIT=$(docker wait lakehouse-engine-rs-lakekeeper-migrate-1)
          if [ "$MIGRATE_EXIT" != "0" ]; then
            echo "::error::lakekeeper-migrate exited $MIGRATE_EXIT (schema migration failed)"
            $COMPOSE logs lakekeeper-migrate
            exit 1
          fi

          $COMPOSE up -d --wait exasol minio keycloak lakekeeper-db lakekeeper

      - name: Run Lakekeeper E2E suite
        run: make test-e2e-lakekeeper

      - name: Dump Lakekeeper stack logs on failure
        if: failure()
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml"
          echo "=== container stats / host free ==="
          $COMPOSE ps || true
          free -m || true
          echo "=== HOST kernel ring buffer (sudo) ==="
          sudo dmesg --ctime | grep -iE 'exaudf|seccomp|segfault|trap|invalid opcode|illegal|sig(sys|ill|segv|abrt)|signal [0-9]|killed process|oom|audit.*denied' | tail -60 || true
          echo "--- last 40 kernel lines (fallback) ---"
          sudo dmesg --ctime | tail -40 || true
          echo "=== keycloak logs ==="
          $COMPOSE logs keycloak | tail -100 || true
          echo "=== lakekeeper-migrate logs ==="
          $COMPOSE logs lakekeeper-migrate | tail -100 || true
          echo "=== lakekeeper logs ==="
          $COMPOSE logs lakekeeper | tail -100 || true
          echo "=== exasql crash logs ==="
          $COMPOSE exec -T exasol sh -c 'find /exa/logs/cored -name "exasql.*" -type f 2>/dev/null | sort | xargs -I{} sh -c "echo === {} ===; tail -40 {}"' || true
          echo "=== collecting /exa/logs tree for artifact ==="
          rm -rf exa-logs-lakekeeper && mkdir -p exa-logs-lakekeeper
          $COMPOSE cp exasol:/exa/logs exa-logs-lakekeeper/ 2>/dev/null || true

      - name: Upload Lakekeeper Exasol logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exa-logs-lakekeeper
          path: exa-logs-lakekeeper/
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml down -v

  # Not yet a required check (#336).
  e2e-unity:
    name: E2E (Unity)
    runs-on: ubuntu-latest
    needs: [build-so]
    timeout-minutes: 45
    env:
      LH_EXASOL_CPUSET: "0-1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup

      - name: Pull stack images
        run: docker compose -f docker-compose.yml -f docker-compose.unity.yml pull --quiet

      # One-shot jobs are `docker wait`-ed first (see `e2e`); seed.sh needs the bucket.
      - name: Start stack (Exasol + MinIO + Unity Catalog)
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.unity.yml"

          $COMPOSE up -d minio-init
          INIT_EXIT=$(docker wait lakehouse-engine-rs-minio-init-1)
          if [ "$INIT_EXIT" != "0" ]; then
            echo "::error::minio-init exited $INIT_EXIT (bucket creation failed)"
            $COMPOSE logs minio-init
            exit 1
          fi

          $COMPOSE up -d --wait minio exasol unitycatalog

      - name: Seed Unity Catalog fixtures
        run: ./scripts/unity/seed.sh

      # Flag-identical to the Makefile's `test-e2e-unity` (which would re-run
      # the bring-up); this step is the authority.
      - name: Run Unity Catalog E2E suite
        run: cargo test -p lakehouse-engine --features unity-e2e --test e2e_unity_test -- --test-threads=1

      - name: Dump Unity stack logs on failure
        if: failure()
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.unity.yml"
          echo "=== container stats / host free ==="
          $COMPOSE ps || true
          free -m || true
          echo "=== HOST kernel ring buffer (sudo) ==="
          sudo dmesg --ctime | grep -iE 'exaudf|seccomp|segfault|trap|invalid opcode|illegal|sig(sys|ill|segv|abrt)|signal [0-9]|killed process|oom|audit.*denied' | tail -60 || true
          echo "--- last 40 kernel lines (fallback) ---"
          sudo dmesg --ctime | tail -40 || true
          echo "=== minio-init logs ==="
          $COMPOSE logs minio-init | tail -100 || true
          echo "=== unitycatalog logs ==="
          $COMPOSE logs unitycatalog | tail -100 || true
          echo "=== minio logs ==="
          $COMPOSE logs minio | tail -100 || true
          echo "=== exasql crash logs ==="
          $COMPOSE exec -T exasol sh -c 'find /exa/logs/cored -name "exasql.*" -type f 2>/dev/null | sort | xargs -I{} sh -c "echo === {} ===; tail -40 {}"' || true
          echo "=== collecting /exa/logs tree for artifact ==="
          rm -rf exa-logs-unity && mkdir -p exa-logs-unity
          $COMPOSE cp exasol:/exa/logs exa-logs-unity/ 2>/dev/null || true

      - name: Upload Unity Exasol logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exa-logs-unity
          path: exa-logs-unity/
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.unity.yml down -v

  # Real Azure account: Azurite's `dfs` endpoint is incomplete. The service
  # principal (container lifecycle only) needs Storage Blob Data Contributor;
  # a data-actions-only role 403s on container create/delete.
  # Not in `release`'s needs, so an Azure outage can't block releases.
  e2e-azure:
    name: E2E (Azure)
    runs-on: ubuntu-latest
    needs: [build-so]
    timeout-minutes: 45
    env:
      LH_EXASOL_CPUSET: "0-1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup

      - name: Pull stack images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml \
            -f docker-compose.lakekeeper.azure.yml \
            pull --quiet exasol keycloak lakekeeper-db lakekeeper-migrate lakekeeper

      - name: Start stack (Exasol + Keycloak + Lakekeeper)
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml -f docker-compose.lakekeeper.azure.yml"

          $COMPOSE up -d lakekeeper-migrate
          MIGRATE_EXIT=$(docker wait lakehouse-engine-rs-lakekeeper-migrate-1)
          if [ "$MIGRATE_EXIT" != "0" ]; then
            echo "::error::lakekeeper-migrate exited $MIGRATE_EXIT (schema migration failed)"
            $COMPOSE logs lakekeeper-migrate
            exit 1
          fi

          $COMPOSE up -d --wait exasol keycloak lakekeeper-db lakekeeper

      - name: Run Azure E2E suite
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: make test-e2e-azure

      - name: Dump Azure stack logs on failure
        if: failure()
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml -f docker-compose.lakekeeper.azure.yml"
          echo "=== container stats / host free ==="
          $COMPOSE ps || true
          free -m || true
          echo "=== HOST kernel ring buffer (sudo) ==="
          sudo dmesg --ctime | grep -iE 'exaudf|seccomp|segfault|trap|invalid opcode|illegal|sig(sys|ill|segv|abrt)|signal [0-9]|killed process|oom|audit.*denied' | tail -60 || true
          echo "--- last 40 kernel lines (fallback) ---"
          sudo dmesg --ctime | tail -40 || true
          echo "=== keycloak logs ==="
          $COMPOSE logs keycloak | tail -100 || true
          echo "=== lakekeeper-migrate logs ==="
          $COMPOSE logs lakekeeper-migrate | tail -100 || true
          echo "=== lakekeeper logs ==="
          $COMPOSE logs lakekeeper | tail -100 || true
          echo "=== exasql crash logs ==="
          $COMPOSE exec -T exasol sh -c 'find /exa/logs/cored -name "exasql.*" -type f 2>/dev/null | sort | xargs -I{} sh -c "echo === {} ===; tail -40 {}"' || true
          echo "=== collecting /exa/logs tree for artifact ==="
          rm -rf exa-logs-azure && mkdir -p exa-logs-azure
          $COMPOSE cp exasol:/exa/logs exa-logs-azure/ 2>/dev/null || true

      - name: Upload Azure Exasol logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exa-logs-azure
          path: exa-logs-azure/
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml -f docker-compose.lakekeeper.azure.yml down -v

  release:
    name: Release
    runs-on: ubuntu-latest
    # lint/unit-tests/licenses must be listed explicitly: e2e only needs build-so.
    # `e2e-azure` is deliberately absent (third-party outage risk); `arm64` is
    # the only test signal for the aarch64 asset.
    needs: [e2e, e2e-lakekeeper, e2e-unity, lint, unit-tests, arm64, licenses, install-script, install-script-e2e]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        run: |
          VER=$(grep -m1 '^version' crates/lakehouse-engine/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Determine highest existing release tag
        id: prior
        run: |
          git fetch --tags --quiet
          HIGHEST=$(git tag -l 'v*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          echo "highest=${HIGHEST:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          HIGHEST: ${{ steps.prior.outputs.highest }}
        run: |
          # Numeric X.Y.Z only; no pre-release/build metadata.
          is_greater() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)" = "$1" ]
          }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if is_greater "$VERSION" "$HIGHEST" || [ "$VERSION" = "$HIGHEST" ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "Tag push for $TAG (version $VERSION) — releasing."
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::error::Tag $TAG (version $VERSION) is older than the highest existing release ($HIGHEST) — refusing to release."
              exit 1
            fi
          else
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already exists — version not bumped; nothing to release."
            elif is_greater "$VERSION" "$HIGHEST"; then
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "Version bumped to $VERSION (previous release: $HIGHEST) — releasing $TAG."
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::error::crates/lakehouse-engine/Cargo.toml version ($VERSION) is not greater than the highest existing release ($HIGHEST), and $TAG doesn't exist — this looks like a broken version bump on main."
              exit 1
            fi
          fi

      - name: Download x86_64 liblakehouse_engine.so
        if: steps.gate.outputs.release == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lakehouse-engine-so-x86_64
          path: artifacts/x86_64

      - name: Download aarch64 liblakehouse_engine.so
        if: steps.gate.outputs.release == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lakehouse-engine-so-aarch64
          path: artifacts/aarch64

      # Uploaded to BucketFS as-is by manual installs: the `udf/` layout and
      # mode 755 must survive extraction.
      - name: Package release tarballs
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail

          verify_arch() {
            so="$1"; expected="$2"
            actual=$(file -b "$so")
            case "$actual" in
              *"$expected"*) ;;
              *) echo "::error::$so should be $expected but is: $actual"; exit 1 ;;
            esac
          }

          verify_arch artifacts/x86_64/liblakehouse_engine.so x86-64
          verify_arch artifacts/aarch64/liblakehouse_engine.so aarch64

          mkdir -p pkg/x86_64/udf pkg/aarch64/udf
          cp artifacts/x86_64/liblakehouse_engine.so pkg/x86_64/udf/
          cp artifacts/aarch64/liblakehouse_engine.so pkg/aarch64/udf/
          chmod 755 pkg/x86_64/udf/liblakehouse_engine.so pkg/aarch64/udf/liblakehouse_engine.so
          tar -czf lakehouse-engine.tar.gz -C pkg/x86_64 udf
          tar -czf lakehouse-engine-aarch64.tar.gz -C pkg/aarch64 udf

      - name: Install Rust 1.94
        if: steps.gate.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)

      - name: Install cargo-about
        if: steps.gate.outputs.release == 'true'
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-about@0.9.0

      - name: Generate third-party notices
        if: steps.gate.outputs.release == 'true'
        run: |
          cargo about generate \
            --manifest-path crates/lakehouse-engine/Cargo.toml \
            -c about.toml about.hbs -o THIRD-PARTY-LICENSES.md

      - name: Create and push tag
        if: steps.gate.outputs.release == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          # install.sh deliberately not attached: users fetch it from `main`
          # (`?ref=<tag>` pins); an asset would freeze installer bugs forever.
          files: |
            lakehouse-engine.tar.gz
            lakehouse-engine-aarch64.tar.gz
            THIRD-PARTY-LICENSES.md
