name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run when a PR branch gets a new push (saves CI minutes,
# avoids two runs racing on the same branch's cache). Never cancel a main-push
# or tag-push run mid-flight — release() depends on that exact run's e2e job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # Keep in lockstep with the Makefile's SLC_VERSION / EXASOL_IMAGE / the three
  # docker-compose.yml image pins — bump here whenever those change.
  EXASOL_IMAGE_TAG: "2025.2.1"
  MINIO_IMAGE_TAG: "RELEASE.2025-01-20T14-49-07Z"
  ICEBERG_REST_IMAGE_TAG: "1.10.1"
  SPARK_IMAGE_TAG: "3.5.7"

jobs:
  # ── build early ──────────────────────────────────────────────────────────
  # Warms the shared host cargo cache that lint/unit-tests/e2e's test-binary
  # compile reuse. Independent of build-so (different toolchain: host vs the
  # rust:1.94-bookworm container) — runs in parallel with it.
  build:
    name: Build (warm cache)
    runs-on: ubuntu-latest
    steps:
      # ubuntu-latest ships only ~21 GB free on /; a cached target/ restore plus
      # a full debug `--all-targets` build of the DataFusion/Arrow/AWS/Iceberg
      # tree can fill it, and ld then dies with SIGBUS (signal 7) when it can't
      # extend an mmap'd object/output file. Reclaim ~12 GB of preinstalled SDKs
      # we never use before building.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)
        with:
          components: clippy, rustfmt

      # Swatinem/rust-cache (not raw actions/cache) because it PRUNES target/
      # before saving: it strips this workspace's own crate artifacts +
      # incremental data and keeps only dependency builds, so the cache stays
      # small instead of ballooning with the full DataFusion/Arrow/Iceberg
      # --all-targets debug tree (the bloat that filled the runner disk and
      # ENOSPC-killed lint/unit-tests). It also keys on rustc + Cargo.lock
      # automatically. This job is the SOLE writer of the shared cache; the
      # fan-out jobs restore it read-only (save-if: false) so they don't each
      # race to save a copy.
      #
      # `cargo build` produces full .rlib codegen — a SUPERSET of what clippy
      # (.rmeta only) and `cargo test` (.rlib, to link the test binary) each
      # need — so this writer's cache serves every reader. The `-rlib` suffix
      # deliberately BUSTS an earlier immutable cache written under `workspace`:
      # in the brief window when lint was also a writer, clippy won the save
      # race and stored a .rmeta-only cache. GitHub cache keys are immutable, so
      # this warm build kept restoring that check-only cache as a "full match"
      # and skipped its own save — leaving unit-tests to recompile the entire
      # dep tree (~17 min) for the .rlib it couldn't find. Bumping the key
      # forces a fresh save of the real .rlib cache. Bump again if it recurs.
      - name: Cache cargo & build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-rlib

      # The workspace has no default-members (see Cargo.toml) so `cargo build`
      # alone is a no-op by design; --workspace is required to actually
      # compile both crates + their test binaries and warm the cache below.
      - name: Build workspace (debug, warm cache)
        run: cargo build --workspace --all-targets

  # ── the real release artifact ─────────────────────────────────────────────
  # Built the same way a developer does: inside rust:1.94-bookworm (glibc
  # 2.36), matching the SLC. Never `cargo build --release` on the runner
  # directly — Ubuntu's glibc is newer and the .so fails to dlopen in Exasol.
  build-so:
    name: Build release .so (Docker)
    runs-on: ubuntu-latest
    # Observed cold-cache duration: ~33 min (full DataFusion/Arrow/Iceberg
    # release build). 60 min is a safety backstop against a genuine hang, not
    # a tight budget.
    timeout-minutes: 60
    steps:
      # A cold release build of the full DataFusion/Arrow/Iceberg tree plus a
      # cached target/ restore can exhaust the ~21 GB default runner disk — the
      # same ENOSPC class that killed lint/unit-tests. Reclaim ~12 GB up front.
      # (Latent until now because CI has only hit the warm path; a Cargo.lock
      # bump forces the cold path.)
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - uses: actions/checkout@v7

      # This build runs INSIDE rust:1.94-bookworm with its cargo home at
      # /usr/local/cargo, so Swatinem/rust-cache (host-side, prunes via the host
      # cargo) can't manage it — we stay on actions/cache.
      #
      # UDF_CARGO_VOL defaults to a *named* Docker volume in the Makefile
      # (fine on a persistent dev machine); override it to a host path here so
      # actions/cache can persist the Docker-side cargo registry across runs.
      # Also cache target/ itself (compiled artifacts) — caching only the
      # registry saves download time but not compile time, since the .so's
      # own target/ dir is otherwise empty on every fresh checkout. Cargo's
      # fingerprint check falls back to content hashes (not just mtimes) when
      # deciding what's stale, so it tolerates checkout resetting mtimes.
      #
      # restore-keys is what keeps a Cargo.lock bump from triggering a full
      # ~33-min cold build: on a lockfile change the exact key misses, but the
      # `docker-cargo-` prefix restores the most recent prior cache, so cargo
      # recompiles only the changed crates instead of the whole dep graph.
      - name: Cache Docker-side cargo registry and target/
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo-docker-registry
            target/
          key: docker-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            docker-cargo-

      - name: Build liblakehouse_engine.so
        run: make cross-musl-udf-build UDF_CARGO_VOL="$HOME/.cargo-docker-registry"

      # `docker run` writes into both the bind-mounted registry and target/ as
      # root (the container's default user), so actions/cache's post-job tar
      # (running as the runner user) can't read those files back out —
      # observed as "Cannot open: Permission denied" / cache save failing
      # silently.
      - name: Fix Docker-side build output ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo-docker-registry" target/

      - name: Upload liblakehouse_engine.so
        uses: actions/upload-artifact@v7
        with:
          name: lakehouse-engine-so
          path: target/release/liblakehouse_engine.so

  # ── fan-out: lint / unit-tests / licenses all need only `build`'s cache ──
  lint:
    name: Check & Lint
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      # Same rationale as the build job: reclaim ~12 GB before restoring the
      # shared cache and compiling on top of it, so clippy's --all-targets pass
      # doesn't ENOSPC on the ~21 GB default runner disk.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)
        with:
          components: clippy, rustfmt

      # dtolnay/rust-toolchain's `components:` doesn't reliably provision
      # rustfmt/clippy for every toolchain snapshot (observed: "'cargo-fmt' is
      # not installed for the toolchain '1.94-x86_64-unknown-linux-gnu'") —
      # same fix exasol-labs/language-container-rs's CI already needed.
      - name: Ensure rustfmt/clippy available on 1.94
        run: rustup component add rustfmt clippy --toolchain 1.94

      # Restore the pruned cache the build job saved (same shared-key); read
      # only — save-if:false so this job never writes its own copy.
      - name: Restore cargo & build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-rlib
          save-if: "false"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      # Reclaim disk before restoring the shared cache + compiling the test
      # binaries, matching build/lint/e2e (avoids the ENOSPC that killed this
      # job).
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)

      - name: Restore cargo & build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-rlib
          save-if: "false"

      # exasol-e2e / cloud-e2e are opt-in features, off by default, so this
      # never touches a live stack.
      - name: Run unit tests
        run: cargo test --workspace

  licenses:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install cargo-deny
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-deny@0.19.9

      # MIT-compliance gate: every third-party dependency must carry a license
      # from deny.toml's allow-list; keep that list in sync with about.toml's
      # `accepted` list (both files cross-reference each other).
      - name: Check licenses
        run: cargo deny check licenses

      - name: Check advisories
        run: cargo deny check advisories

  # ── viability gate: full local Exasol + MinIO + Iceberg-REST stack ───────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [build-so, lint, unit-tests, licenses]
    timeout-minutes: 30
    env:
      # Standard GitHub-hosted runners have 2 vCPUs; docker-compose.yml's
      # exasol service default (4) exceeds what Docker will accept ("range of
      # CPUs is from 0.01 to 2.00, as there are only 2 CPUs available").
      LH_EXASOL_CPUS: "2"
    steps:
      - uses: actions/checkout@v7

      # Downloaded after checkout, so its mtime is newer than the checked-out
      # sources — the Makefile's mtime-based `test-e2e → cross-musl-udf-build`
      # dependency then sees the artifact as up to date and skips rebuilding.
      - name: Download liblakehouse_engine.so
        uses: actions/download-artifact@v8
        with:
          name: lakehouse-engine-so
          path: target/release/

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)

      # Read-only restore of the shared workspace cache to warm the host debug
      # build of the e2e test binary. save-if:false so this job doesn't prune
      # target/ (which would delete the .so downloaded into target/release/
      # above) and doesn't save a redundant copy.
      - name: Restore cargo & build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-rlib
          save-if: "false"

      # The standard runner's / has too little free space for the Exasol image
      # + its cached tarball + MinIO/Iceberg-REST images + the DB's /exa data.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift /usr/lib/jvm || true
          sudo docker image prune -af || true
          echo "--- after cleanup ---"; df -h /

      - name: Cache Exasol DB image
        uses: actions/cache@v6
        with:
          path: /tmp/[redacted].tar
          key: [redacted]-${{ env.EXASOL_IMAGE_TAG }}

      - name: Load or pull Exasol image
        run: |
          TAG="${{ env.EXASOL_IMAGE_TAG }}"
          TAR=/tmp/[redacted].tar
          if [ -f "$TAR" ]; then
            docker load -i "$TAR"
          else
            docker pull "exasol/docker-db:$TAG"
            docker save "exasol/docker-db:$TAG" -o "$TAR"
          fi

      - name: Cache MinIO image
        uses: actions/cache@v6
        with:
          path: /tmp/minio.tar
          key: minio-${{ env.MINIO_IMAGE_TAG }}

      - name: Load or pull MinIO image
        run: |
          TAG="${{ env.MINIO_IMAGE_TAG }}"
          TAR=/tmp/minio.tar
          if [ -f "$TAR" ]; then
            docker load -i "$TAR"
          else
            docker pull "minio/minio:$TAG"
            docker save "minio/minio:$TAG" -o "$TAR"
          fi

      - name: Cache Iceberg REST fixture image
        uses: actions/cache@v6
        with:
          path: /tmp/iceberg-rest.tar
          key: iceberg-rest-fixture-${{ env.ICEBERG_REST_IMAGE_TAG }}

      - name: Load or pull Iceberg REST fixture image
        run: |
          TAG="${{ env.ICEBERG_REST_IMAGE_TAG }}"
          TAR=/tmp/iceberg-rest.tar
          if [ -f "$TAR" ]; then
            docker load -i "$TAR"
          else
            docker pull "apache/iceberg-rest-fixture:$TAG"
            docker save "apache/iceberg-rest-fixture:$TAG" -o "$TAR"
          fi

      # Only the base Spark image is cached here; the Iceberg Spark runtime +
      # AWS bundle jars come from `--packages` (Ivy resolution) inside the
      # spark-iceberg-fixtures container itself. That ~150 MB download is NOT
      # cached — it is repeated on every stack bring-up (a container-local Ivy
      # cache under /tmp, deliberately not volume-backed; see the rationale in
      # scripts/spark-fixtures/run_fixtures.sh).
      - name: Cache Spark image
        uses: actions/cache@v6
        with:
          path: /tmp/spark.tar
          key: spark-${{ env.SPARK_IMAGE_TAG }}

      - name: Load or pull Spark image
        run: |
          TAG="${{ env.SPARK_IMAGE_TAG }}"
          TAR=/tmp/spark.tar
          if [ -f "$TAR" ]; then
            docker load -i "$TAR"
          else
            docker pull "apache/spark:$TAG"
            docker save "apache/spark:$TAG" -o "$TAR"
          fi

      # ROOT CAUSE of "VM crashed" (SQL state 22002) for every UDF on GitHub's
      # ubuntu-latest kernel, diagnosed in exasol-labs/language-container-rs:
      # Exasol launches nschroot to sandbox the UDF, which needs CAP_SYS_ADMIN
      # inside an unprivileged user namespace. Ubuntu 24.04 ships
      # kernel.apparmor_restrict_unprivileged_userns=1, which denies that even
      # inside a --privileged container. lakehouse-engine-rs's E2E suite
      # actually spawns UDF sandboxes (LAKEHOUSE_ADAPTER / LAKEHOUSE_SCAN), so
      # it hits this exact failure without the fix below.
      - name: Allow unprivileged user namespaces (Exasol UDF sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl kernel.apparmor_restrict_unprivileged_userns

      # Two-phase: `docker compose up --wait` doesn't reliably support a
      # one-shot container (minio-init) in the same wait set as long-running
      # services — even a clean exit(0) trips it into exit code 1 (confirmed:
      # every service was healthy, --wait still failed). `docker wait` the
      # init job to completion first, then --wait only the services that stay
      # running.
      - name: Start stack (Exasol + MinIO + Iceberg REST)
        run: |
          docker compose up -d minio-init
          # `docker wait` itself always exits 0 (it successfully waited); the
          # container's actual exit code is its stdout — check it explicitly.
          INIT_EXIT=$(docker wait lakehouse-engine-rs-minio-init-1)
          if [ "$INIT_EXIT" != "0" ]; then
            echo "::error::minio-init exited $INIT_EXIT (bucket creation failed)"
            docker compose logs minio-init
            exit 1
          fi
          docker compose up -d --wait exasol minio iceberg-rest

          # spark-iceberg-fixtures is a second one-shot job (same rationale as
          # minio-init above): it authors the positional-delete E2E fixtures
          # by running Apache Spark once, then exits — so it's waited on with
          # `docker wait`, not folded into the --wait set above.
          docker compose up -d spark-iceberg-fixtures
          SPARK_FIXTURES_EXIT=$(docker wait lakehouse-engine-rs-spark-iceberg-fixtures-1)
          if [ "$SPARK_FIXTURES_EXIT" != "0" ]; then
            echo "::error::spark-iceberg-fixtures exited $SPARK_FIXTURES_EXIT (positional-delete fixture authoring failed)"
            docker compose logs spark-iceberg-fixtures
            exit 1
          fi

      # SLC download, BucketFS upload, and VS creation all happen in-process
      # inside the Rust test harness (crates/lakehouse-engine/tests/e2e_scan_test.rs
      # setup_e2e), so no separate install-slc/exapump step is needed here.
      - name: Run E2E suite
        run: make test-e2e

      # A UDF sandbox crash produces zero-byte DB-side logs; the real reason
      # only shows up in the host kernel ring buffer (dmesg), which needs sudo.
      - name: Dump Exasol logs on failure
        if: failure()
        run: |
          echo "=== container stats / host free ==="
          docker compose ps || true
          free -m || true
          echo "=== HOST kernel ring buffer (sudo) ==="
          sudo dmesg --ctime | grep -iE 'exaudf|seccomp|segfault|trap|invalid opcode|illegal|sig(sys|ill|segv|abrt)|signal [0-9]|killed process|oom|audit.*denied' | tail -60 || true
          echo "--- last 40 kernel lines (fallback) ---"
          sudo dmesg --ctime | tail -40 || true
          echo "=== exasql crash logs ==="
          docker compose exec -T exasol sh -c 'find /exa/logs/cored -name "exasql.*" -type f 2>/dev/null | sort | xargs -I{} sh -c "echo === {} ===; tail -40 {}"' || true
          echo "=== collecting /exa/logs tree for artifact ==="
          rm -rf exa-logs && mkdir -p exa-logs
          docker compose cp exasol:/exa/logs exa-logs/ 2>/dev/null || true

      - name: Upload Exasol logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exa-logs
          path: exa-logs/
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ── release: main-push-with-version-bump, or a direct tag push ──────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [e2e]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        run: |
          VER=$(grep -m1 '^version' crates/lakehouse-engine/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      # Verify the version trail, not just tag-existence: find the highest
      # existing vX.Y.Z tag and confirm this version is strictly greater
      # (semver). Stricter than an existence-only check, which would silently
      # let through a version edited downward or left unchanged as long as
      # that exact tag string didn't already exist.
      - name: Determine highest existing release tag
        id: prior
        run: |
          git fetch --tags --quiet
          HIGHEST=$(git tag -l 'v*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          echo "highest=${HIGHEST:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          HIGHEST: ${{ steps.prior.outputs.highest }}
        run: |
          # ponytail: numeric X.Y.Z only (no pre-release/build metadata) — this
          # project's versions are plain semver, so a full semver comparator
          # would be pure ceremony here.
          is_greater() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)" = "$1" ]
          }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tag-push path: the tag already exists by definition. Still
            # reject a regressed/duplicate version (e.g. an accidental re-tag
            # of an old release).
            if is_greater "$VERSION" "$HIGHEST" || [ "$VERSION" = "$HIGHEST" ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "Tag push for $TAG (version $VERSION) — releasing."
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::error::Tag $TAG (version $VERSION) is older than the highest existing release ($HIGHEST) — refusing to release."
              exit 1
            fi
          else
            # Main-push path: release only on a genuine forward version bump.
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already exists — version not bumped; nothing to release."
            elif is_greater "$VERSION" "$HIGHEST"; then
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "Version bumped to $VERSION (previous release: $HIGHEST) — releasing $TAG."
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::error::crates/lakehouse-engine/Cargo.toml version ($VERSION) is not greater than the highest existing release ($HIGHEST), and $TAG doesn't exist — this looks like a broken version bump on main."
              exit 1
            fi
          fi

      - name: Download liblakehouse_engine.so
        if: steps.gate.outputs.release == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lakehouse-engine-so

      - name: Install Rust 1.94
        if: steps.gate.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@8fae6aadcd3e1a6f3fcb446ce7f9438c9d1349f1 # 1.94 branch (toolchain 1.94.0 baked into action.yml)

      - name: Install cargo-about
        if: steps.gate.outputs.release == 'true'
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-about@0.9.0

      # Third-party notices for the crate graph shipped in the .so. Never
      # committed (see .gitignore) — generated fresh for each release, kept in
      # sync with deny.toml's allow-list via the cross-referencing comments in
      # about.toml.
      - name: Generate third-party notices
        if: steps.gate.outputs.release == 'true'
        run: |
          cargo about generate \
            --manifest-path crates/lakehouse-engine/Cargo.toml \
            -c about.toml about.hbs -o THIRD-PARTY-LICENSES.md

      - name: Create and push tag
        if: steps.gate.outputs.release == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            liblakehouse_engine.so
            THIRD-PARTY-LICENSES.md
