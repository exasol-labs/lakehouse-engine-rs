[workspace]
members = ["crates/lakehouse-engine", "crates/lakehouse-catalog", "crates/vs-expression", "crates/lakehouse-e2e"]
# Build the UDF .so only via `make cross-udf-build` (rust:1.98.1-trixie): the SDK
# fingerprint embeds the rustc hash, so a host-built .so is rejected at load.
resolver = "2"

# No [profile.*] here — see .cargo/config.toml.

[workspace.package]
license = "MIT"

# CAUTION: this file never enters CI's cache key (rust-cache#268). A
# `features` edit that doesn't move Cargo.lock poisons the cache; prefer
# declaring features on the member crate. To bust it, bump the `shared-key`
# suffix on EVERY rust-cache step of that namespace at once (#133):
#   workspace-rlib  — ci.yml `build-host` + `lint`, and .github/actions/e2e-setup
#   llvm-cov        — ci.yml `unit-tests`
#   workspace-arm64 — ci.yml `arm64`
[workspace.dependencies]

# Must match datafusion's arrow major.
arrow   = { version = "59.3.2", default-features = false }
parquet = { version = "59.3.2", features = ["async"] }

datafusion = { version = "55.2", default-features = false, features = ["parquet", "sql"] }

object_store = { version = "0.13.2", features = ["aws"] }

regex = { version = "1" }

# Same line delta_kernel and iceberg resolve, so a decoded deletion vector's `RoaringTreemap` is
# the type the row-position delete path merges into.
roaring = { version = "0.11" }

# Must link the same arrow major as datafusion/exasol-udf-sdk. Pinned to one `main` rev
# because no release is on arrow 59 yet (#499); all three crates must share the rev.
iceberg              = { git = "https://github.com/apache/iceberg-rust", rev = "da5cc19a9f7c9e8ea14dc40d4a82974cd26def42" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", rev = "da5cc19a9f7c9e8ea14dc40d4a82974cd26def42" }
# RestCatalog requires a StorageFactory; iceberg core ships no S3 one.
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", rev = "da5cc19a9f7c9e8ea14dc40d4a82974cd26def42", default-features = false, features = ["opendal-s3"] }

tokio = { version = "1", features = ["rt", "macros"] }

# Also the SLC version (fingerprint must match). `make install-slc` and
# deploy/scripts/install.sh scrape this line, so keep `version` inline.
exasol-udf-sdk    = { version = "0.33.0", features = ["emit-arrow"] }
exasol-udf-macros = { version = "0.33.0" }

serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror  = { version = "2" }
anyhow     = { version = "1" }

chrono  = { version = "0.4" }
futures = { version = "0.3" }
url     = { version = "2" }
percent-encoding = { version = "2" }

aws-sigv4              = { version = "1.6", default-features = true }
aws-credential-types   = { version = "1.3" }
aws-smithy-runtime-api = { version = "1.18", features = ["client"] }
aws-sdk-glue           = { version = "1.170", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
# The TLS stack under reqwest, for typed handshake errors.
rustls  = { version = "0.23", default-features = false }

# Official AWS STS client: owns the AssumeRole wire protocol, signing, and endpoint rules.
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }

# USER_MAPPING templates. Without `multi_template` and `macros`, include, import, extends, and
# macro fail to compile; `fuel` bounds a render.
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "fuel", "serde"] }
