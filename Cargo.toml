[workspace]
members = ["crates/lakehouse-engine", "crates/vs-expression"]
# The UDF crate is a cdylib that MUST be compiled inside rust:1.94-bookworm
# (glibc 2.36) via `make cross-musl-udf-build`. A bare host `cargo build
# --release` must never emit the .so — it would write a host-glibc binary that
# fails to dlopen inside Exasol. default-members enforces that invariant.
#
# There is no root package here (greenfield PoC, UDF-only); default-members is
# left unset so `cargo build` at the workspace root is a no-op by default and
# individual crates must be addressed with `-p`.
resolver = "2"

[workspace.package]
license = "MIT"

[workspace.dependencies]
# Shared single-version pins. Member crates reference these with
# `{ workspace = true }`, optionally adding per-crate features.

# Arrow ecosystem: pin to 58 to match exasol-udf-sdk 0.14.0 and datafusion 54.
arrow   = { version = "58", default-features = false }
parquet = { version = "58", features = ["async"] }

# DataFusion 54.0.0 co-resolves on arrow ^58.3.0.
datafusion = { version = "54", default-features = false, features = ["parquet", "sql"] }

# S3-compatible object store (MinIO); datafusion 54 requires ^0.13.2.
object_store = { version = "0.13.2", features = ["aws"] }

# Roaring bitmaps for the positional-delete set (RoaringTreemap). Pinned to the
# same 0.11 line iceberg 0.10.0-rc.2 already resolves transitively, so the scan
# UDF's vendored `build_deletes_row_selection` consumes the identical type.
roaring = { version = "0.11" }

# Iceberg REST catalog.
# Pinned to the v0.10.0-rc.2 git tag (not yet on crates.io). iceberg 0.10.0-rc.2
# links arrow 58 internally, the same tree as datafusion/exasol-udf-sdk below —
# the workspace is a single arrow-58 tree end to end.
# iceberg's transitive dep fastnum tracks rustc; 0.7.5+ requires rustc 1.94,
# which this workspace builds on (see rust-toolchain.toml), so fastnum is no
# longer lock-pinned.
iceberg = { git = "https://github.com/apache/iceberg-rust", tag = "v0.10.0-rc.2" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", tag = "v0.10.0-rc.2" }
# iceberg core ships only Local/Memory StorageFactory impls (iceberg::io); S3
# support lives in this separate crate and a StorageFactory registration is
# still mandatory for RestCatalog. The S3 (MinIO) factory lives here; its
# config keys (s3.endpoint, s3.region, s3.access-key-id, ...) are passed in
# the same props map handed to RestCatalogBuilder::load.
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", tag = "v0.10.0-rc.2", default-features = false, features = ["opendal-s3"] }

# Async runtime: tokio current-thread is sufficient for blocking UDF entry
# points; full feature set available behind the exasol-e2e feature.
tokio = { version = "1", features = ["rt", "macros"] }

exasol-udf-sdk = { version = "0.20.3", features = ["emit-arrow"] }

serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror  = { version = "2" }
anyhow     = { version = "1" }

chrono  = { version = "0.4" }
futures = { version = "0.3" }
url     = { version = "2" }
