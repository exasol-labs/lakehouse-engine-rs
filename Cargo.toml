[workspace]
members = ["crates/lakehouse-engine", "crates/lakehouse-catalog", "crates/lakehouse-catalog-write", "crates/vs-expression", "crates/lakehouse-e2e"]
# Build the UDF .so only via `make cross-udf-build` (rust:1.98.1-trixie): the SDK
# fingerprint embeds the rustc hash, so a host-built .so is rejected at load.
resolver = "2"

# No [profile.*] here — see .cargo/config.toml.

[workspace.package]
license = "MIT"

# CAUTION: this file never enters CI's cache key (rust-cache#268). A
# `features` edit that doesn't move Cargo.lock poisons the cache; prefer
# declaring features on the member crate. To bust it, bump the `shared-key`
# suffix on EVERY rust-cache step of that namespace at once (#133):
#   workspace-rlib  — ci.yml `build-host` + `lint`, and .github/actions/e2e-setup
#   llvm-cov        — ci.yml `unit-tests`
#   workspace-arm64 — ci.yml `arm64`
[workspace.dependencies]

# Must match datafusion's arrow major.
arrow   = { version = "60.2.0", default-features = false }
parquet = { version = "60.2.0", features = ["async"] }

# Pinned to the 56.0.0 release tag until it is published to crates.io.
datafusion = { git = "https://github.com/apache/datafusion", tag = "56.0.0", default-features = false, features = ["parquet", "sql"] }
datafusion-datasource = { git = "https://github.com/apache/datafusion", tag = "56.0.0", default-features = false }

object_store = { version = "0.14.2", features = ["aws"] }

regex = { version = "1" }

# Same line delta_kernel and iceberg resolve, so a decoded deletion vector's `RoaringTreemap` is
# the type the row-position delete path merges into.
roaring = { version = "0.11" }

# Must link the same arrow major as datafusion/exasol-udf-sdk. Pinned to one `main` rev
# because no release is on arrow 60 yet; all three crates must share the rev.
iceberg              = { git = "https://github.com/apache/iceberg-rust", rev = "a7160a0a2318028df1a8ae88abbb3b5d611fa3d8" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", rev = "a7160a0a2318028df1a8ae88abbb3b5d611fa3d8" }
# RestCatalog requires a StorageFactory; iceberg core ships no S3 one.
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", rev = "a7160a0a2318028df1a8ae88abbb3b5d611fa3d8", default-features = false, features = ["opendal-s3"] }
# Names the `Context` of `ProvideCredential::provide_credential`, which iceberg-storage-opendal does
# not re-export. Pinned to the version it resolves, so both name the same trait.
reqsign-core = { version = "=3.3.2" }

tokio = { version = "1", features = ["rt", "macros"] }

# The private `iceberg::Catalog` impl of the catalog write crate.
async-trait = { version = "0.1" }
# Backoff jitter of catalog writes; the line the engine already links.
rand        = { version = "0.8" }

# Also the SLC version (fingerprint must match). `make install-slc` and
# deploy/scripts/install.sh scrape this line, so keep `version` inline.
exasol-udf-sdk    = { version = "0.34.0", features = ["emit-arrow"] }
exasol-udf-macros = { version = "0.34.0" }

serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
jiter      = { version = "0.17", default-features = false }
thiserror  = { version = "2" }
anyhow     = { version = "1" }

chrono  = { version = "0.4" }
chrono-tz = { version = "0.10.4" }
futures = { version = "0.3" }
url     = { version = "2" }
percent-encoding = { version = "2" }

aws-sigv4              = { version = "1.6", default-features = true }
aws-credential-types   = { version = "1.3" }
aws-smithy-runtime-api = { version = "1.18", features = ["client"] }
aws-sdk-glue           = { version = "1.170", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
# The `Retry-After` HTTP-date parser; aws-sdk-glue already compiles this crate.
aws-smithy-types       = { version = "1.8" }

# The line iceberg, delta_kernel, and object_store link, so the `.so` carries one HTTP stack.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
# The TLS stack under reqwest, for typed handshake errors.
rustls  = { version = "0.23", default-features = false }
# The HTTP stack under reqwest, for its typed incomplete-message error.
hyper   = { version = "1", default-features = false }
# reqwest's own proxy selection from HTTP_PROXY, HTTPS_PROXY, and NO_PROXY, to name the proxy in an error.
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy"] }
http       = { version = "1" }

# Official AWS STS client: owns the AssumeRole wire protocol, signing, and endpoint rules.
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }

# USER_MAPPING templates. Without `multi_template` and `macros`, include, import, extends, and
# macro fail to compile; `fuel` bounds a render.
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "fuel", "serde"] }
