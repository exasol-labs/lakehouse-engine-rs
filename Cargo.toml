[workspace]
members = ["crates/lakehouse-engine", "crates/vs-expression"]
# The UDF crate is a cdylib that MUST be compiled inside rust:1.92-bookworm
# (glibc 2.36) via `make cross-musl-udf-build`. A bare host `cargo build
# --release` must never emit the .so — it would write a host-glibc binary that
# fails to dlopen inside Exasol. default-members enforces that invariant.
#
# There is no root package here (greenfield PoC, UDF-only); default-members is
# left unset so `cargo build` at the workspace root is a no-op by default and
# individual crates must be addressed with `-p`.
resolver = "2"

[workspace.package]
license = "MIT"

[workspace.dependencies]
# Shared single-version pins. Member crates reference these with
# `{ workspace = true }`, optionally adding per-crate features.

# Arrow ecosystem: pin to 58 to match exasol-udf-sdk 0.14.0 and datafusion 54.
arrow   = { version = "58", default-features = false }
parquet = { version = "58", features = ["async"] }

# DataFusion 54.0.0 co-resolves on arrow ^58.3.0.
datafusion = { version = "54", default-features = false, features = ["parquet", "sql"] }

# S3-compatible object store (MinIO); datafusion 54 requires ^0.13.2.
object_store = { version = "0.13.2", features = ["aws"] }

# Iceberg REST catalog.
# iceberg 0.9.1 links arrow 57 internally; that resolves separately from the
# datafusion/SDK arrow 58 tree — valid because only SDK Value types cross the
# .so boundary (never Arrow types). See CLAUDE.md §DataFusion streaming.
# iceberg 0.9.1 also requires rustc 1.92; Cargo.lock pins its transitive dep
# fastnum to 0.7.4 (max version compatible with rustc 1.92 — 0.7.5 requires
# 1.94). See Cargo.lock and the `cargo update fastnum --precise 0.7.4` note.
iceberg              = { version = "0.9.1" }
iceberg-catalog-rest = { version = "0.9.1" }
# iceberg 0.9.1 split storage backends into a separate crate and made a
# StorageFactory mandatory for RestCatalog. The S3 (MinIO) factory lives here;
# its config keys (s3.endpoint, s3.region, s3.access-key-id, ...) are passed in
# the same props map handed to RestCatalogBuilder::load.
iceberg-storage-opendal = { version = "0.9.1", default-features = false, features = ["opendal-s3"] }

# Async runtime: tokio current-thread is sufficient for blocking UDF entry
# points; full feature set available behind the exasol-e2e feature.
tokio = { version = "1", features = ["rt", "macros"] }

exasol-udf-sdk = { version = "0.20.0", features = ["emit-arrow"] }

serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror  = { version = "2" }
anyhow     = { version = "1" }

chrono  = { version = "0.4" }
futures = { version = "0.3" }
url     = { version = "2" }
