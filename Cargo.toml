[workspace]
members = ["crates/lakehouse-engine", "crates/lakehouse-catalog", "crates/vs-expression"]
# Build the UDF .so only via `make cross-udf-build` (rust:1.94-trixie): the SDK
# fingerprint embeds the rustc hash, so a host-built .so is rejected at load.
resolver = "2"

# No [profile.*] here — see .cargo/config.toml.

[workspace.package]
license = "MIT"

# CAUTION: this file never enters CI's cache key (rust-cache#268). A
# `features` edit that doesn't move Cargo.lock poisons the cache; prefer
# declaring features on the member crate. To bust it, bump the `shared-key`
# suffix on EVERY rust-cache step of that namespace at once (#133):
#   workspace-rlib  — ci.yml `build-host` + `lint`, and .github/actions/e2e-setup
#   llvm-cov        — ci.yml `unit-tests`
#   workspace-arm64 — ci.yml `arm64`
[workspace.dependencies]

# Must match datafusion's arrow major.
arrow   = { version = "58", default-features = false }
parquet = { version = "58", features = ["async"] }

datafusion = { version = "54.1", default-features = false, features = ["parquet", "sql"] }

object_store = { version = "0.13.2", features = ["aws"] }

# Same line iceberg resolves, so the vendored `build_deletes_row_selection` shares its type.
roaring = { version = "0.11" }

# Must link the same arrow major as datafusion/exasol-udf-sdk.
iceberg = "0.10.0"
iceberg-catalog-rest = "0.10.0"
# RestCatalog requires a StorageFactory; iceberg core ships no S3 one.
iceberg-storage-opendal = { version = "0.10.0", default-features = false, features = ["opendal-s3"] }

tokio = { version = "1", features = ["rt", "macros"] }

# Also the SLC version (fingerprint must match). `make install-slc` and
# deploy/scripts/install.sh scrape this line, so keep `version` inline.
exasol-udf-sdk    = { version = "0.30.0", features = ["emit-arrow"] }
exasol-udf-macros = { version = "0.30.0" }

serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror  = { version = "2" }
anyhow     = { version = "1" }

chrono  = { version = "0.4" }
futures = { version = "0.3" }
url     = { version = "2" }
percent-encoding = { version = "2" }

aws-sigv4              = { version = "1.4", default-features = true }
aws-credential-types   = { version = "1.2" }
aws-smithy-runtime-api = { version = "1", features = ["client"] }

reqwest = { version = "0.12" }
