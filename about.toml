# cargo-about config for the third-party license bundle attached to GitHub
# Releases. Keep `accepted` in sync with deny.toml's [licenses].allow — they
# must name the same set of licenses (this list adds "OpenSSL", which
# native-tls/openssl-sys carry as a combined notice; that's the only
# intentional difference).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true

targets = ["x86_64-unknown-linux-gnu"]
