# Keep in sync with deny.toml's [licenses].allow; "OpenSSL" is the only
# intentional extra (native-tls/openssl-sys combined notice).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true

targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
