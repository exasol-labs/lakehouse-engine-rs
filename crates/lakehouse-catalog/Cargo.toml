[package]
name = "lakehouse-catalog"
version = "0.10.0"
edition = "2024"
license.workspace = true

[lib]
name = "lakehouse_catalog"

[features]
# Exposes the fake catalog server of `test_support` to dependent crates' tests. Never enabled
# outside tests.
test-support = ["tokio/net", "tokio/io-util"]

[dependencies]
exasol-udf-sdk = { workspace = true }

iceberg                 = { workspace = true }
iceberg-catalog-rest    = { workspace = true }
# The iceberg FileIO's storage, on the clients the scan uses too (#701).
object_store = { workspace = true, features = ["azure"] }
typetag      = { workspace = true }
async-trait  = { workspace = true }
bytes        = "1"

futures    = { workspace = true }
serde      = { workspace = true }
# net: `lookup_host`, the system resolver of the DNS cache. io-util: closing a FileIO upload.
tokio      = { workspace = true, features = ["sync", "time", "net", "io-util"] }
serde_json = { workspace = true }
url        = { workspace = true }

# MSRV 1.94.1 (aws-sdk-glue, aws-smithy-runtime-api): must stay buildable by the rust:1.98.1-trixie UDF builder.
aws-sigv4              = { workspace = true }
aws-credential-types   = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-sdk-glue           = { workspace = true }
aws-smithy-types       = { workspace = true }
aws-smithy-http-client = { workspace = true }

rand             = { workspace = true }

reqwest = { workspace = true }
rustls  = { workspace = true }
hyper   = { workspace = true }
hyper-util = { workspace = true }
http       = { workspace = true }

# AWS STS AssumeRole.
aws-sdk-sts = { workspace = true }

[dev-dependencies]
