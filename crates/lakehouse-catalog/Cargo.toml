[package]
name = "lakehouse-catalog"
version = "0.8.1"
edition = "2024"
license.workspace = true
autotests = false

[lib]
name = "lakehouse_catalog"

[dependencies]
exasol-udf-sdk = { workspace = true }

iceberg                 = { workspace = true }
iceberg-catalog-rest    = { workspace = true }
# `opendal-azdls`: ADLS Gen2 FileIO backend, in addition to the workspace `opendal-s3`.
iceberg-storage-opendal = { workspace = true, features = ["opendal-azdls"] }

futures    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
url        = { workspace = true }

# MSRV 1.94.1 (aws-sdk-glue, aws-smithy-runtime-api): must stay buildable by the rust:1.98.1-trixie UDF builder.
aws-sigv4              = { workspace = true }
aws-credential-types   = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-sdk-glue           = { workspace = true }

reqwest = { workspace = true }
rustls  = { workspace = true }

# AWS STS AssumeRole.
aws-sdk-sts = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

# Test targets are listed explicitly (autotests = false), so a new top-level tests/*.rs file never adds a binary silently (#523).
[[test]]
name = "it"
