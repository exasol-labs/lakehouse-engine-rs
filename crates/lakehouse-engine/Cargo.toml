[package]
name = "lakehouse-engine"
version = "0.57.4"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
exasol-udf-sdk    = { workspace = true }
exasol-udf-macros = { workspace = true }

vs-expression     = { path = "../vs-expression" }
lakehouse-catalog = { path = "../lakehouse-catalog" }

arrow      = { workspace = true, features = ["json"] }
parquet    = { workspace = true }
datafusion = { workspace = true, features = ["unicode_expressions"] }

# `azure`: ADLS Gen2 (`abfss://`) object store; unions with the workspace `aws`.
object_store = { workspace = true, features = ["azure"] }
async-trait = "0.1"
# object_store re-exports no alias for the Bytes in `ObjectStore::get_ranges`.
bytes = "1"
hex = "0.4"

roaring = { workspace = true }

iceberg = { workspace = true }

# Declared here, not in `[workspace.dependencies]`: member manifests enter CI's cache key.
# `default-features = false` on the default engine: its defaults pick the arrow major and TLS
# stack, and both must match the rest of the `.so`.
# `internal-api` is the only way the kernel exposes partition columns, column-mapping mode, and
# the reader protocol; it has no semver guarantee, so its accessors are confined to
# `format::delta_replay` and `format::delta_protocol`.
delta_kernel = { version = "0.30.0", features = [
    "default-engine-base",
    "arrow-59",
    "internal-api",
] }
delta_kernel_default_engine = { version = "0.30.0", default-features = false, features = [
    "arrow-59",
    "rustls",
] }

# rt-multi-thread: DATAFUSION_THREADS_PER_UDF > 1. sync: shared delete-read Semaphore.
tokio      = { workspace = true, features = ["rt-multi-thread", "sync"] }
serde      = { workspace = true }
serde_json = { workspace = true }

chrono  = { workspace = true }
futures = { workspace = true }
url     = { workspace = true }
percent-encoding = { workspace = true }

# default-features off so no subscriber machinery enters the .so.
tracing = { version = "0.1", default-features = false }

minijinja = { workspace = true }

aes-gcm = "0.10"
hkdf    = "0.12"
sha2    = "0.10"
base64  = "0.22"
rand    = "0.8"

[dev-dependencies]
# time: deterministic overlap in concurrency tests. net + io-util: loopback catalog fake.
tokio               = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
exasol-udf-sdk      = { workspace = true, features = ["test-support"] }
arrow               = { workspace = true, features = ["ipc"] }
parquet             = { workspace = true }
tempfile            = { version = "3" }
iceberg             = { workspace = true }
reqwest             = { workspace = true, features = ["blocking"] }
futures             = { workspace = true }

# Host integration tests share the `it` binary (tests/it/main.rs). This one keeps its own process
# because every scan resets the process-global footer record it asserts on (#523).
[[test]]
name = "scan_footer_refetch_observable"
