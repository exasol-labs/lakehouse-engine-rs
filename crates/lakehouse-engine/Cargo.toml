[package]
name = "lakehouse-engine"
version = "0.48.1"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Requires a live Exasol + MinIO + REST catalog stack; must FAIL (not skip) if unreachable.
exasol-e2e = []
# Requires real AWS Glue + Exasol; SKIPS (not fails) when required env vars are absent.
cloud-e2e = []
# Requires a live Exasol + MinIO + Lakekeeper + Keycloak stack; same FAIL contract as exasol-e2e.
lakekeeper-e2e = []
# Requires the Azure (ADLS Gen2) static-credential stack; same FAIL contract as exasol-e2e.
azure-e2e = []
# Requires a live Exasol + MinIO + Unity Catalog OSS stack; same FAIL contract as exasol-e2e.
unity-e2e = []

[dependencies]
exasol-udf-sdk    = { workspace = true }
exasol-udf-macros = { workspace = true }

vs-expression     = { path = "../vs-expression" }
lakehouse-catalog = { path = "../lakehouse-catalog" }

arrow      = { workspace = true, features = ["json"] }
parquet    = { workspace = true }
datafusion = { workspace = true, features = ["unicode_expressions"] }

# `azure`: ADLS Gen2 (`abfss://`) object store; unions with the workspace `aws`.
object_store = { workspace = true, features = ["azure"] }
async-trait = "0.1"
# object_store re-exports no alias for the Bytes in `ObjectStore::get_ranges`.
bytes = "1"

roaring = { workspace = true }

iceberg = { workspace = true }

# Declared here, not in `[workspace.dependencies]`: member manifests enter CI's cache key.
# `default-features = false` on the default engine: its defaults pull in `arrow-59`, a
# second arrow tree next to `arrow-58`.
# `internal-api` is the only way 0.26 exposes partition columns, column-mapping mode, and
# the reader protocol; it has no semver guarantee, so its accessors are confined to
# `format::delta_replay` and `format::delta_protocol`.
delta_kernel = { version = "0.26", features = [
    "default-engine-base",
    "arrow-58",
    "internal-api",
] }
delta_kernel_default_engine = { version = "0.26", default-features = false, features = [
    "arrow-58",
    "rustls",
] }

# rt-multi-thread: DATAFUSION_THREADS_PER_UDF > 1. sync: shared delete-read Semaphore.
tokio      = { workspace = true, features = ["rt-multi-thread", "sync"] }
serde      = { workspace = true }
serde_json = { workspace = true }

chrono  = { workspace = true }
futures = { workspace = true }
url     = { workspace = true }
percent-encoding = { workspace = true }

# default-features off so no subscriber machinery enters the .so.
tracing = { version = "0.1", default-features = false }

aes-gcm = "0.10"
hkdf    = "0.12"
sha2    = "0.10"
base64  = "0.22"
rand    = "0.8"

[dev-dependencies]
# time: deterministic overlap in concurrency tests. net + io-util: loopback catalog fake.
tokio               = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
exasol-udf-sdk      = { workspace = true, features = ["test-support"] }
arrow               = { workspace = true, features = ["ipc"] }
parquet             = { workspace = true }
# Not tpchgen-arrow: it has no arrow-58 release.
tpchgen             = { version = "2.0.2" }
iceberg             = { workspace = true }
iceberg-catalog-rest = { workspace = true }
iceberg-storage-opendal = { workspace = true, features = ["opendal-azdls"] }
reqwest             = { workspace = true, features = ["blocking"] }
# Seed harness forces static MinIO admin credentials over Lakekeeper's vended STS token.
reqsign-core        = "3.0.1"
# azure-e2e harness: container lifecycle via Entra ID; the scan path uses the account key.
azure_storage_blob  = "1.0"
azure_identity      = "1.0"
azure_core          = "1.1"
tungstenite         = { version = "0.29.0", features = ["native-tls"] }
native-tls          = "0.2"
rsa                 = { version = "0.9", features = ["sha2", "pkcs5"] }
futures             = { workspace = true }
anyhow              = { workspace = true }
