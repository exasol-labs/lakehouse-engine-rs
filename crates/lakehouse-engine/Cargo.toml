[package]
name = "lakehouse-engine"
version = "0.14.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Gate E2E tests (require a live Exasol + MinIO + REST catalog stack) behind this
# feature. Test code enabled by this feature must FAIL (not skip) when the stack
# is unreachable.
exasol-e2e = []
# Gate cloud E2E tests (require real AWS Glue + Exasol cluster) behind this
# feature. Test code enabled by this feature SKIPS (never fails) when the
# required environment variables are absent — the opposite of exasol-e2e.
cloud-e2e = []

[dependencies]
exasol-udf-sdk    = { version = "0.19.1", features = ["emit-arrow"] }
exasol-udf-macros = { version = "0.19.1" }

vs-expression = { path = "../vs-expression" }

arrow      = { workspace = true }
parquet    = { workspace = true }
datafusion = { workspace = true }

object_store = { workspace = true }

iceberg              = { workspace = true }
iceberg-catalog-rest = { workspace = true }
iceberg-storage-opendal = { workspace = true }

# rt-multi-thread: scan UDF builds a multi-thread runtime when DATAFUSION_THREADS_PER_UDF > 1.
tokio      = { workspace = true, features = ["rt-multi-thread"] }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }

chrono  = { workspace = true }
futures = { workspace = true }
url     = { workspace = true }

# `udf_log!` (the lc-rs debug surface) and the scan phase-telemetry gate expand
# to `tracing::Level`; `ctx.debug_level()` returns it. Direct dep so those names
# resolve in this crate. default-features off: only the `Level` type is used, no
# subscriber machinery crosses into the `.so`.
tracing = { version = "0.1", default-features = false }

# SigV4 signing for Glue REST catalog requests (engine-only: not used by vs-expression).
# MSRV 1.91.1 — compatible with rustc 1.92 that builds the UDF .so.
aws-sigv4             = { version = "1.4", default-features = true }
aws-credential-types  = { version = "1.2" }
# aws-smithy-runtime-api is a direct dependency of aws-sigv4 (for Identity); we declare
# it explicitly so the `use aws_smithy_runtime_api::client::identity::Identity` import
# in sigv4.rs resolves without relying on transitive re-export.
aws-smithy-runtime-api = { version = "1", features = ["client"] }

# Async reqwest client for the self-issued signed load_table GET (task 4.1).
# Intentionally async (no "blocking" feature): the adapter's handle_pushdown_request runs
# inside rt.block_on(async { ... }), so a blocking reqwest call would panic at runtime.
# The dev-dependency reqwest uses "blocking" only for the test harness; that is independent.
reqwest = { version = "0.12" }

[dev-dependencies]
tokio               = { workspace = true, features = ["rt-multi-thread", "macros"] }
arrow               = { workspace = true, features = ["ipc"] }
parquet             = { workspace = true }
# iceberg 0.9.1 links arrow/parquet 57 internally; the seed helper feeds Arrow
# RecordBatch + parquet WriterProperties straight into iceberg's writer APIs, so
# those objects MUST be the 57-typed variants iceberg expects (the workspace
# arrow/parquet 58 are a different, incompatible type tree). Aliased so both
# coexist in the test crate.
ice_arrow_array     = { package = "arrow-array", version = "57" }
ice_arrow_schema    = { package = "arrow-schema", version = "57" }
ice_parquet         = { package = "parquet", version = "57" }
# TPC-H generator for the live smoke test loader (tests/tpch_loader.rs). Pins
# arrow ^57.1 — same major as the iceberg 0.9.1 write stack above, so the Arrow
# RecordBatch it yields feeds straight into iceberg's writer with no conversion.
tpchgen             = { version = "2.0.2" }
tpchgen-arrow       = { version = "2.0.2" }
iceberg             = { workspace = true }
iceberg-catalog-rest = { workspace = true }
reqwest             = { version = "0.12", features = ["blocking"] }
tungstenite         = { version = "0.29.0", features = ["native-tls"] }
native-tls          = "0.2"
rsa                 = { version = "0.9", features = ["sha2", "pkcs5"] }
base64              = "0.22"
rand                = "0.8"
bytes               = "1"
futures             = { workspace = true }
anyhow              = { workspace = true }
