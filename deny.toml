# cargo-deny gates the dependency graph shipped in liblakehouse_engine.so.
# Keep [licenses].allow in sync with about.toml's `accepted` list — they must
# name the same set of licenses (about.toml adds "OpenSSL" for the native-tls
# notice text; that's the only intentional difference).

[advisories]
ignore = [
    # paste is unmaintained but not vulnerable. Transitive dep from parquet
    # (Apache Arrow), same as exasol-labs/language-container-rs's identical
    # ignore for the same crate. Track: https://github.com/apache/arrow-rs/issues
    { id = "RUSTSEC-2024-0436", reason = "Transitive dep from parquet, unmaintained but not vulnerable" },

    # Marvin Attack timing sidechannel in `rsa`. `rsa` is a dev-dependency only
    # (crates/lakehouse-engine/Cargo.toml [dev-dependencies], used by the E2E
    # test harness's connect-back auth fixture) — it is never linked into the
    # shipped liblakehouse_engine.so, so the timing-sidechannel exposure this
    # advisory describes does not apply to the distributed artifact.
    { id = "RUSTSEC-2023-0071", reason = "Dev-dependency only (E2E test harness), not shipped in liblakehouse_engine.so" },

    # quick-xml DoS pair (CPU-quadratic attribute check; unbounded NsReader
    # namespace-decl allocation), fixed in quick-xml >=0.41.0. Blocked: three
    # different transitive paths pull three different quick-xml versions, and
    # none of their direct dependents allow >=0.41.0 yet under semver caret
    # pins — reqsign 0.16.5 requires "^0.37", opendal 0.55.0 requires "^0.38",
    # object_store 0.13.2 requires "^0.39.0" (all via iceberg-storage-opendal /
    # datafusion). Exploitation requires a malicious response from the
    # configured S3-compatible storage or Iceberg/Glue REST catalog endpoint —
    # an operator-configured trust boundary, not arbitrary untrusted input —
    # which narrows the practical attack surface versus the advisories'
    # "unauthenticated remote attacker" framing (aimed at services parsing
    # third-party-published XML, e.g. RPKI RRDP feeds). Re-evaluate when
    # reqsign/opendal/object_store bump their quick-xml requirement.
    { id = "RUSTSEC-2026-0194", reason = "Blocked by reqsign/opendal/object_store's quick-xml semver pins; XML source is the operator-configured storage/catalog endpoint, not untrusted internet input" },
    { id = "RUSTSEC-2026-0195", reason = "Blocked by reqsign/opendal/object_store's quick-xml semver pins; XML source is the operator-configured storage/catalog endpoint, not untrusted internet input" },

    # Invalid pointer dereference in crossbeam-epoch's `fmt::Pointer`/`fmt::Display`
    # impls for `Atomic`/`Shared` when the underlying pointer is null/invalid,
    # fixed in >=0.9.20. Transitive via moka 0.12.15 (iceberg-rust 0.10.0's
    # concurrent-cache dependency, ADR-079's git-tag pin) -> crossbeam-epoch
    # 0.9.18, three levels below our own code. Neither lakehouse-engine nor
    # moka's public API exposes a way to Display/Debug-format a raw
    # crossbeam_epoch::Atomic/Shared value; triggering this requires reaching
    # into moka's internal cache implementation directly. Blocked on moka/
    # iceberg-rust bumping their crossbeam-epoch requirement; re-evaluate on
    # the next iceberg-rust bump.
    { id = "RUSTSEC-2026-0204", reason = "Transitive via moka (iceberg-rust's cache dependency) -> crossbeam-epoch 0.9.18; not reachable through moka's public API, blocked by iceberg-rust's pinned moka version" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    # webpki-roots ships the Mozilla root cert bundle under this permissive
    # data license (attribution + no-endorsement, no copyleft).
    "CDLA-Permissive-2.0",
]
# This workspace's own crates (lakehouse-engine, vs-expression) are MIT and
# unpublished; don't check them against the third-party allow-list above.
private = { ignore = true }
