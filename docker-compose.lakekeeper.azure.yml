# Azure E2E overlay — layered ON TOP of docker-compose.yml AND
# docker-compose.lakekeeper.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml \
#     -f docker-compose.lakekeeper.azure.yml up -d --wait \
#     exasol keycloak lakekeeper-db openfga-db openfga openfga-migrate lakekeeper-migrate lakekeeper
#
# Drops lakekeeper's seaweedfs dependency (storage is ADLS Gen2); `!override` is
# required because Compose merges depends_on maps by key.
services:
  lakekeeper:
    depends_on: !override
      lakekeeper-migrate:
        condition: service_completed_successfully
      lakekeeper-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      openfga:
        condition: service_healthy
