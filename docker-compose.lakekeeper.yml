# Overlay on docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml up -d --wait \
#     minio exasol keycloak lakekeeper-db lakekeeper-migrate lakekeeper
# OpenFGA is omitted: the suite tests authentication only, so Lakekeeper runs
# with the default `allowall` authz backend.

services:
  keycloak:
    image: "${LH_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0.7}"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./scripts/keycloak-realm-iceberg.json:/opt/keycloak/data/import/realm.json:ro
    command:
      - start-dev
      - --health-enabled=true
      - --metrics-enabled=true
      - --import-realm
      - --log-level=INFO
    # Probes the imported realm so dependents wait for import; image has no curl.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/127.0.0.1/8080;echo -e "GET /realms/iceberg/.well-known/openid-configuration HTTP/1.1\r\nhost: 127.0.0.1:8080\r\nConnection: close\r\n\r\n" >&3;grep "jwks_uri" <&3',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    ports:
      - "${LH_KEYCLOAK_PORT:-28080}:8080"
    networks:
      lakehouse:
        ipv4_address: 10.84.0.30

  lakekeeper-db:
    image: "${LH_LAKEKEEPER_DB_IMAGE:-postgres:17}"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    networks:
      lakehouse:
        ipv4_address: 10.84.0.31

  lakekeeper-migrate:
    image: "${LH_LAKEKEEPER_IMAGE:-quay.io/lakekeeper/catalog:v0.13.1}"
    entrypoint: ["/home/nonroot/lakekeeper", "migrate"]
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - RUST_LOG=info
    restart: "no"
    depends_on:
      lakekeeper-db:
        condition: service_healthy
    networks:
      - lakehouse

  lakekeeper:
    image: "${LH_LAKEKEEPER_IMAGE:-quay.io/lakekeeper/catalog:v0.13.1}"
    command: ["serve"]
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      # Keycloak stamps `iss` from the request host, so accept both issuers.
      - LAKEKEEPER__OPENID_PROVIDER_URI=http://keycloak:8080/realms/iceberg
      - "LAKEKEEPER__OPENID_ADDITIONAL_ISSUERS=http://localhost:${LH_KEYCLOAK_PORT:-28080}/realms/iceberg"
      - LAKEKEEPER__OPENID_AUDIENCE=lakekeeper
      - RUST_LOG=info,lakekeeper=info
    # Distroless image: no curl/wget.
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      lakekeeper-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${LH_LAKEKEEPER_PORT:-28181}:8181"
    networks:
      lakehouse:
        ipv4_address: 10.84.0.32

  # MinIO scopes STS-vended creds by the caller's policy, so Lakekeeper's
  # dedicated user caps vended sessions at the `warehouse` bucket.
  minio-lakekeeper-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\",\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::warehouse\",\"arn:aws:s3:::warehouse/*\"]}]}' > /tmp/lakekeeper-warehouse-policy.json;
      mc admin policy create local lakekeeper-warehouse /tmp/lakekeeper-warehouse-policy.json || mc admin policy add local lakekeeper-warehouse /tmp/lakekeeper-warehouse-policy.json || true;
      mc admin user add local lakekeeper lakekeeper-secret-key || true;
      mc admin policy attach local lakekeeper-warehouse --user lakekeeper || mc admin policy set local lakekeeper-warehouse user=lakekeeper || true;
      echo 'minio lakekeeper STS user + policy ready'
      "
    restart: "no"
    networks:
      - lakehouse

  # Re-declares the base /etc/hosts loop to add keycloak and lakekeeper.
  exasol:
    extra_hosts:
      - "keycloak:10.84.0.30"
      - "lakekeeper:10.84.0.32"
    entrypoint:
      - /bin/bash
      - -c
      - |
        ( while true; do
            if [ -f /etc/hosts ]; then
              grep -qE '(^|[[:space:]])minio([[:space:]]|$)' /etc/hosts || printf '10.84.0.10 minio\n' >> /etc/hosts
              grep -qE '(^|[[:space:]])iceberg-rest([[:space:]]|$)' /etc/hosts || printf '10.84.0.11 iceberg-rest\n' >> /etc/hosts
              grep -qE '(^|[[:space:]])keycloak([[:space:]]|$)' /etc/hosts || printf '10.84.0.30 keycloak\n' >> /etc/hosts
              grep -qE '(^|[[:space:]])lakekeeper([[:space:]]|$)' /etc/hosts || printf '10.84.0.32 lakekeeper\n' >> /etc/hosts
            fi
            sleep 2
          done ) &
        exec "$(ls /opt/exasol/cos-*/docker/entrypoint.sh | head -1)" init-sc
