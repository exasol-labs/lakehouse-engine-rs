# Overlay on docker-compose.yml. Lakekeeper enforces permissions through OpenFGA
# (LAKEKEEPER__AUTHZ_BACKEND=openfga). One-shots run first and in this order, because
# `lakekeeper migrate` writes the authorization model into OpenFGA:
#   docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml up openfga-migrate
#   docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml up lakekeeper-migrate
#   docker compose -f docker-compose.yml -f docker-compose.lakekeeper.yml up -d --wait \
#     seaweedfs exasol keycloak lakekeeper-db openfga-db openfga lakekeeper
# Lakekeeper does not rebuild ownership or grants when its authz backend changes after
# bootstrap, so a stack persisted from the earlier `allowall` overlay needs
# `docker compose ... down -v` once.

services:
  keycloak:
    image: "${LH_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0.7}"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./scripts/keycloak-realm-iceberg.json:/opt/keycloak/data/import/realm.json:ro
    command:
      - start-dev
      - --health-enabled=true
      - --metrics-enabled=true
      - --import-realm
      - --log-level=INFO
    # Probes the imported realm so dependents wait for import; image has no curl.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/127.0.0.1/8080;echo -e "GET /realms/iceberg/.well-known/openid-configuration HTTP/1.1\r\nhost: 127.0.0.1:8080\r\nConnection: close\r\n\r\n" >&3;grep "jwks_uri" <&3',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    ports:
      - "${LH_KEYCLOAK_PORT:-28080}:8080"
    networks:
      lakehouse:
        ipv4_address: 10.84.0.30

  lakekeeper-db:
    image: "${LH_LAKEKEEPER_DB_IMAGE:-postgres:17}"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    networks:
      lakehouse:
        ipv4_address: 10.84.0.31

  openfga-db:
    image: "${LH_OPENFGA_DB_IMAGE:-postgres:17}"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=openfga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432 -d openfga"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    networks:
      lakehouse:
        ipv4_address: 10.84.0.33

  openfga-migrate:
    image: "${LH_OPENFGA_IMAGE:-openfga/openfga:v1.14.2}"
    command: ["migrate"]
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:postgres@openfga-db:5432/openfga?sslmode=disable
    restart: "no"
    depends_on:
      openfga-db:
        condition: service_healthy
    networks:
      - lakehouse

  openfga:
    image: "${LH_OPENFGA_IMAGE:-openfga/openfga:v1.14.2}"
    command: ["run"]
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:postgres@openfga-db:5432/openfga?sslmode=disable
      - OPENFGA_AUTHN_METHOD=none
      - OPENFGA_PLAYGROUND_ENABLED=false
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
      openfga-db:
        condition: service_healthy
    networks:
      lakehouse:
        ipv4_address: 10.84.0.34

  lakekeeper-migrate:
    image: "${LH_LAKEKEEPER_IMAGE:-quay.io/lakekeeper/catalog:v0.13.1}"
    entrypoint: ["/home/nonroot/lakekeeper", "migrate"]
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__AUTHZ_BACKEND=openfga
      - LAKEKEEPER__OPENFGA__ENDPOINT=http://openfga:8081
      - RUST_LOG=info
    restart: "no"
    depends_on:
      lakekeeper-db:
        condition: service_healthy
      openfga:
        condition: service_healthy
    networks:
      - lakehouse

  lakekeeper:
    image: "${LH_LAKEKEEPER_IMAGE:-quay.io/lakekeeper/catalog:v0.13.1}"
    command: ["serve"]
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      # Keycloak stamps `iss` from the request host, so accept both issuers.
      - LAKEKEEPER__OPENID_PROVIDER_URI=http://keycloak:8080/realms/iceberg
      - "LAKEKEEPER__OPENID_ADDITIONAL_ISSUERS=http://localhost:${LH_KEYCLOAK_PORT:-28080}/realms/iceberg"
      - LAKEKEEPER__OPENID_AUDIENCE=lakekeeper
      - LAKEKEEPER__AUTHZ_BACKEND=openfga
      - LAKEKEEPER__OPENFGA__ENDPOINT=http://openfga:8081
      - RUST_LOG=info,lakekeeper=info
    # Distroless image: no curl/wget.
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      lakekeeper-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      openfga:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "${LH_LAKEKEEPER_PORT:-28181}:8181"
    networks:
      lakehouse:
        ipv4_address: 10.84.0.32

  # Re-declares the base /etc/hosts loop to add keycloak and lakekeeper.
  exasol:
    extra_hosts:
      - "keycloak:10.84.0.30"
      - "lakekeeper:10.84.0.32"
    entrypoint:
      - /bin/bash
      - -c
      - |
        ( while true; do
            if [ -f /etc/hosts ]; then
              grep -qE '(^|[[:space:]])seaweedfs([[:space:]]|$)' /etc/hosts || printf '10.84.0.10 seaweedfs\n' >> /etc/hosts
              grep -qE '(^|[[:space:]])iceberg-rest([[:space:]]|$)' /etc/hosts || printf '10.84.0.11 iceberg-rest\n' >> /etc/hosts
              grep -qE '(^|[[:space:]])keycloak([[:space:]]|$)' /etc/hosts || printf '10.84.0.30 keycloak\n' >> /etc/hosts
              grep -qE '(^|[[:space:]])lakekeeper([[:space:]]|$)' /etc/hosts || printf '10.84.0.32 lakekeeper\n' >> /etc/hosts
            fi
            sleep 2
          done ) &
        exec "$(ls /opt/exasol/cos-*/docker/entrypoint.sh | head -1)" init-sc
