# Overlay that swaps docker-db, which is amd64-only, for the multi-arch Exasol Nano image.
# scripts/e2e-stack.sh applies it last, over every stack, when EXASOL_FLAVOR is `nano`.
# Nano's image holds no shell, so it keeps no /etc/hosts loop and no healthcheck: Docker's DNS
# resolves the service names, and scripts/e2e-stack.sh probes readiness from a sidecar.

services:
  exasol:
    image: "${EXASOL_IMAGE:-exasol/nano:2026.2.0-nano.8}"
    entrypoint: ["/controller"]
    # Nano sizes DB RAM to most of the Docker VM's memory by default, starving the sibling services.
    # Nano's SYSTIMESTAMP reads UTC under its default CET zone, which the UDF VM's TZ follows, so
    # sysTZ=UTC makes them agree. Params are space-separated: a second `params=` replaces the first.
    command: ["init", "params=dbram=${LH_NANO_DBRAM:-4096} sysTZ=UTC"]
    healthcheck:
      disable: true
