# Overlay on docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.unity.yml up -d --wait \
#     minio exasol unitycatalog
#   ./scripts/unity/seed.sh
# UC OSS 0.5.x has no S3 endpoint override (upstream #43), so the engine's
# ObjectStore injects the MinIO endpoint for vended credentials itself.

services:
  unitycatalog:
    image: "${LH_UNITY_IMAGE:-unitycatalog/unitycatalog:v0.5.0}"
    depends_on:
      minio:
        condition: service_healthy
    # Workdir is /home/unitycatalog (not /opt as some docs state); no default server.properties.
    volumes:
      - ./scripts/unity/server.properties:/home/unitycatalog/etc/conf/server.properties:ro
    # The MinIO STS session seed.sh mints and injects. Pass-through form on
    # purpose: a present-but-empty key would send UC to a real
    # sts.amazonaws.com AssumeRole with the host's ambient AWS credentials.
    environment:
      - s3.accessKey.0
      - s3.secretKey.0
      - s3.sessionToken.0
    # No curl in the image; wget is present.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/api/2.1/unity-catalog/catalogs || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    ports:
      - "${LH_UNITY_PORT:-18080}:8080"
    networks:
      lakehouse:
        ipv4_address: 10.84.0.50

  # Re-declares the base /etc/hosts loop to add unitycatalog.
  exasol:
    extra_hosts:
      - "unitycatalog:10.84.0.50"
    entrypoint:
      - /bin/bash
      - -c
      - |
        ( while true; do
            if [ -f /etc/hosts ]; then
              grep -qE '(^|[[:space:]])minio([[:space:]]|$)' /etc/hosts || printf '10.84.0.10 minio\n' >> /etc/hosts
              grep -qE '(^|[[:space:]])iceberg-rest([[:space:]]|$)' /etc/hosts || printf '10.84.0.11 iceberg-rest\n' >> /etc/hosts
              grep -qE '(^|[[:space:]])unitycatalog([[:space:]]|$)' /etc/hosts || printf '10.84.0.50 unitycatalog\n' >> /etc/hosts
            fi
            sleep 2
          done ) &
        exec "$(ls /opt/exasol/cos-*/docker/entrypoint.sh | head -1)" init-sc
