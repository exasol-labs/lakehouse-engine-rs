# Host ports are env-overridable and distinct from sibling stacks; in-network
# service names and ports are fixed (UDFs reach http://seaweedfs:8333 etc.).

services:
  seaweedfs:
    # Identities, the WarehouseRead policy and the LakehouseReader role live in
    # seaweedfs-iam.json; >= 4.44 is required for static-user principal ARNs in trust policies.
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -bucket=warehouse
      - -s3.config=/etc/seaweedfs/iam.json
      - -s3.iam.config=/etc/seaweedfs/iam.json
      - -s3.iam.readOnly=false
    ports:
      - "${LH_SEAWEEDFS_PORT:-19000}:8333"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs-iam.json:/etc/seaweedfs/iam.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 1s
    networks:
      lakehouse:
        ipv4_address: ${LH_SUBNET_PREFIX:-10.84}.0.10

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: lhadmin
      AWS_SECRET_ACCESS_KEY: lhadminsecret123
      AWS_REGION: us-east-1
    ports:
      - "${LH_REST_PORT:-18181}:8181"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
      start_interval: 1s
    networks:
      lakehouse:
        ipv4_address: ${LH_SUBNET_PREFIX:-10.84}.0.11

  # One-shot: Spark authors fixtures iceberg-rust cannot write (apache/iceberg-rust#340).
  spark-iceberg-fixtures:
    image: exadockerci4/spark-lakehouse:4.1.1-iceberg-1
    depends_on:
      seaweedfs:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    # AWS SDK v2 fails writes without a region, even against SeaweedFS.
    environment:
      AWS_REGION: us-east-1
    volumes:
      - ./scripts/spark-fixtures:/fixtures:ro
    entrypoint:
      - /bin/bash
      - /fixtures/run_fixtures.sh
    restart: "no"
    networks:
      - lakehouse

  # Only the proxy resolves the *-via-proxy names, so a request that bypasses
  # it fails on DNS. Overlays add their own services' names.
  proxy:
    image: kalaksi/tinyproxy:1.7
    volumes:
      - ./scripts/proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./scripts/proxy/filter:/etc/tinyproxy/filter:ro
    extra_hosts:
      - "seaweedfs-via-proxy:${LH_SUBNET_PREFIX:-10.84}.0.10"
      - "iceberg-rest-via-proxy:${LH_SUBNET_PREFIX:-10.84}.0.11"
    networks:
      lakehouse:
        ipv4_address: ${LH_SUBNET_PREFIX:-10.84}.0.12

  exasol:
    image: "${EXASOL_IMAGE:-docker.io/exasol/docker-db:2025.1.16}"
    privileged: true
    # A CPU set, not `cpus:`: the UDF sandbox has no cgroup fs, so only
    # affinity is visible to core-count detection (#421).
    cpuset: "${LH_EXASOL_CPUSET:-}"
    # UDF sandboxes need far more than Docker's 64 MB default.
    shm_size: "2g"
    # init-sc reads no EXA_* env vars; DB runs at image defaults (SYS password `exasol`).
    volumes:
      - exa-data:/exa
    ports:
      - "${LH_EXASOL_PORT:-28563}:8563"
      - "${LH_BUCKETFS_PORT:-22581}:2581"
    entrypoint:
      - /bin/bash
      - -c
      - |
        # docker-db writes /etc/resolv.conf from its NameServers setting (8.8.8.8 by default),
        # dropping Docker's DNS, which resolves every service name (#701); point it back once
        # confd accepts jobs.
        ( until bash -lc "confd_client general_settings changes: '{Global: {NameServers: 127.0.0.11}}'" >/dev/null 2>&1; do
            sleep 5
          done ) &
        exec "$(ls /opt/exasol/cos-*/docker/entrypoint.sh | head -1)" init-sc
    healthcheck:
      # Healthy only once Docker's DNS is in place, so `up --wait` never hands tests the 8.8.8.8 setup.
      test: ["CMD-SHELL", "grep -q 127.0.0.11 /etc/resolv.conf && timeout 3 bash -c '</dev/tcp/localhost/8563'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    networks:
      lakehouse:
        ipv4_address: ${LH_SUBNET_PREFIX:-10.84}.0.20

volumes:
  seaweedfs-data:
  exa-data:

networks:
  lakehouse:
    # Unique name and subnet outside Docker's 172.x pool to avoid sibling-stack collisions.
    name: ${LH_NETWORK:-lakehouse-engine}
    ipam:
      config:
        - subnet: ${LH_SUBNET_PREFIX:-10.84}.0.0/16
