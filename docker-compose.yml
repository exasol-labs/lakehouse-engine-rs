# Host ports are env-overridable and distinct from sibling stacks; in-network
# service names and ports are fixed (UDFs reach http://minio:9000 etc.).

services:
  minio:
    # Public, protocol-compatible MinIO fork (upstream images need a subscription).
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: localhost
    command: server /data --console-address ":9001"
    ports:
      - "${LH_MINIO_PORT:-19000}:9000"
      - "${LH_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      lakehouse:
        ipv4_address: 10.84.0.10

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo 'bucket ready'
      "
    # One-shot: `docker wait` it rather than including it in an `up --wait` set.
    restart: "no"
    networks:
      - lakehouse

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "${LH_REST_PORT:-18181}:8181"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      lakehouse:
        ipv4_address: 10.84.0.11

  # One-shot: Spark authors fixtures iceberg-rust cannot write (apache/iceberg-rust#340).
  spark-iceberg-fixtures:
    image: apache/spark:3.5.7
    depends_on:
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    # AWS SDK v2 fails writes without a region, even against MinIO.
    environment:
      AWS_REGION: us-east-1
    volumes:
      - ./scripts/spark-fixtures:/fixtures:ro
    entrypoint:
      - /bin/bash
      - /fixtures/run_fixtures.sh
    restart: "no"
    networks:
      - lakehouse

  exasol:
    image: "${EXASOL_IMAGE:-docker.io/exasol/docker-db:2025.1.16}"
    privileged: true
    # A CPU set, not `cpus:`: the UDF sandbox has no cgroup fs, so only
    # affinity is visible to core-count detection (#421).
    cpuset: "${LH_EXASOL_CPUSET:-0-3}"
    # UDF sandboxes need far more than Docker's 64 MB default.
    shm_size: "2g"
    # init-sc reads no EXA_* env vars; DB runs at image defaults (SYS password `exasol`).
    volumes:
      - exa-data:/exa
    ports:
      - "${LH_EXASOL_PORT:-28563}:8563"
      - "${LH_BUCKETFS_PORT:-22581}:2581"
    # exaconf rewrites /etc/hosts and /etc/resolv.conf on startup, wiping
    # extra_hosts, so the entrypoint loop re-adds the static service entries.
    extra_hosts:
      - "minio:10.84.0.10"
      - "iceberg-rest:10.84.0.11"
    entrypoint:
      - /bin/bash
      - -c
      - |
        ( while true; do
            if [ -f /etc/hosts ] && ! grep -qE '(^|[[:space:]])minio([[:space:]]|$)' /etc/hosts; then
              printf '10.84.0.10 minio\n10.84.0.11 iceberg-rest\n' >> /etc/hosts
            fi
            sleep 2
          done ) &
        exec "$(ls /opt/exasol/cos-*/docker/entrypoint.sh | head -1)" init-sc
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8563' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    networks:
      lakehouse:
        ipv4_address: 10.84.0.20

volumes:
  minio-data:
  exa-data:

networks:
  lakehouse:
    # Unique name and subnet outside Docker's 172.x pool to avoid sibling-stack collisions.
    name: lakehouse-engine
    ipam:
      config:
        - subnet: 10.84.0.0/16
