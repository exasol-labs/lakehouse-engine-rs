# ponytail: Dedicated host ports so this stack coexists with the sibling stacks
# (strata-rs: 8563/2581/9000; lc-rs: 18563/12581). All host ports are
# env-overridable so the E2E suite can always pick free ports; the container-
# internal ports (8563/2581/9000/9001/8181) and the docker-network service
# names (exasol/minio/iceberg-rest) are unchanged, so a UDF inside Exasol still
# reaches MinIO at http://minio:9000 and the catalog at http://iceberg-rest:8181.
#   Host defaults:  Exasol SQL 28563 · BucketFS 22581 · MinIO 19000/19001 · REST 18181

services:
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: localhost
    command: server /data --console-address ":9001"
    ports:
      - "${LH_MINIO_PORT:-19000}:9000"
      - "${LH_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      lakehouse:
        ipv4_address: 172.21.0.10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo 'bucket ready'
      "
    restart: on-failure
    networks:
      - lakehouse

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "${LH_REST_PORT:-18181}:8181"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      lakehouse:
        ipv4_address: 172.21.0.11

  exasol:
    image: "${EXASOL_IMAGE:-docker.io/exasol/docker-db:2025.2.1}"
    privileged: true
    shm_size: "1g"
    environment:
      EXA_DB_MEM_SIZE: "${EXASOL_DB_MEM_SIZE:-4 GiB}"
      EXA_SYS_PASSWORD: "${EXASOL_SYS_PASSWORD:-exasol}"
    volumes:
      - exa-data:/exa
    ports:
      - "${LH_EXASOL_PORT:-28563}:8563"
      - "${LH_BUCKETFS_PORT:-22581}:2581"
    # Exasol's exaconf REGENERATES /etc/resolv.conf (→ 8.8.8.8) and /etc/hosts on
    # startup, wiping the entries Docker injects via extra_hosts — so docker-network
    # service-name DNS does not resolve from inside the UDF. The entrypoint wrapper
    # below restores the two static-IP host entries AFTER exaconf has written
    # /etc/hosts (a background loop that re-adds them if missing), so the VS
    # connection props http://minio:9000 and http://iceberg-rest:8181 resolve from
    # inside the UDF with NO manual patch. The static IPs match minio/iceberg-rest.
    # extra_hosts also sets the same entries at the Docker layer (intent + the brief
    # window before exaconf runs).
    extra_hosts:
      - "minio:172.21.0.10"
      - "iceberg-rest:172.21.0.11"
    entrypoint:
      - /bin/bash
      - -c
      - |
        ( while true; do
            if [ -f /etc/hosts ] && ! grep -qE '(^|[[:space:]])minio([[:space:]]|$)' /etc/hosts; then
              printf '172.21.0.10 minio\n172.21.0.11 iceberg-rest\n' >> /etc/hosts
            fi
            sleep 2
          done ) &
        exec "$(ls /opt/exasol/cos-*/docker/entrypoint.sh | head -1)" init-sc
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8563' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    networks:
      lakehouse:
        ipv4_address: 172.21.0.20

volumes:
  minio-data:
  exa-data:

networks:
  lakehouse:
    name: lakehouse
    ipam:
      config:
        - subnet: 172.21.0.0/16
