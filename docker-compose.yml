# ponytail: Dedicated host ports so this stack coexists with the sibling stacks
# (strata-rs: 8563/2581/9000; lc-rs: 18563/12581). All host ports are
# env-overridable so the E2E suite can always pick free ports; the container-
# internal ports (8563/2581/9000/9001/8181) and the docker-network service
# names (exasol/minio/iceberg-rest) are unchanged, so a UDF inside Exasol still
# reaches MinIO at http://minio:9000 and the catalog at http://iceberg-rest:8181.
#   Host defaults:  Exasol SQL 28563 · BucketFS 22581 · MinIO 19000/19001 · REST 18181

services:
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: localhost
    command: server /data --console-address ":9001"
    ports:
      - "${LH_MINIO_PORT:-19000}:9000"
      - "${LH_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      lakehouse:
        ipv4_address: 10.84.0.10

  minio-init:
    # Pinned (was :latest) — same rationale as the iceberg-rest-fixture pin below.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo 'bucket ready'
      "
    # "no" (was on-failure): this is a one-shot job, not a long-running
    # service — it either succeeds or it doesn't, there's nothing to restart.
    # (`docker compose up --wait` doesn't reliably support one-shot containers
    # regardless of restart policy — see the CI workflow's two-phase bring-up
    # for the actual fix: `docker wait` this container instead of including it
    # in the --wait set.)
    restart: "no"
    networks:
      - lakehouse

  iceberg-rest:
    # Pinned (was :latest) — an unpinned tag on a core E2E dependency is a
    # silent-CI-break risk; 1.10.1 is Apache Iceberg's current stable release.
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "${LH_REST_PORT:-18181}:8181"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      lakehouse:
        ipv4_address: 10.84.0.11

  # Positional-delete fixtures (Apache Spark, Iceberg Spark runtime). One-shot
  # job — mirrors minio-init: not a long-running service, just Spark's
  # merge-on-read write path exercised once at stack bring-up to author
  # Iceberg positional-delete fixtures that iceberg-rust cannot write itself
  # (see scripts/spark-fixtures/run_fixtures.sh for the upstream-tracking
  # comment + drop condition, apache/iceberg-rust#340). Joined to the SAME
  # shared REST catalog + MinIO the rest of the stack uses, so the VS
  # resolves the fixtures through its normal catalog path.
  spark-iceberg-fixtures:
    image: apache/spark:3.5.7
    depends_on:
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    volumes:
      - ./scripts/spark-fixtures:/fixtures:ro
    entrypoint:
      - /bin/bash
      - /fixtures/run_fixtures.sh
    # "no" (same rationale as minio-init): a one-shot fixture job, not a
    # long-running service.
    restart: "no"
    networks:
      - lakehouse

  exasol:
    image: "${EXASOL_IMAGE:-docker.io/exasol/docker-db:2025.2.1}"
    privileged: true
    # Give Exasol multiple CPUs so the scan UDF's shard fan-out + DataFusion
    # threading have cores to run on (the live-smoke test exercises this).
    cpus: "${LH_EXASOL_CPUS:-4}"
    # 2g (was 1g): the UDF script VM needs far more than Docker's 64 MB
    # default once it actually spawns a UDF sandbox — which this stack's E2E
    # suite does (LAKEHOUSE_ADAPTER / LAKEHOUSE_SCAN), unlike sibling stacks
    # that only run the DB uncapped without exercising the sandbox.
    shm_size: "2g"
    environment:
      EXA_DB_MEM_SIZE: "${EXASOL_DB_MEM_SIZE:-4 GiB}"
      EXA_SYS_PASSWORD: "${EXASOL_SYS_PASSWORD:-exasol}"
    volumes:
      - exa-data:/exa
    ports:
      - "${LH_EXASOL_PORT:-28563}:8563"
      - "${LH_BUCKETFS_PORT:-22581}:2581"
    # Exasol's exaconf REGENERATES /etc/resolv.conf (→ 8.8.8.8) and /etc/hosts on
    # startup, wiping the entries Docker injects via extra_hosts — so docker-network
    # service-name DNS does not resolve from inside the UDF. The entrypoint wrapper
    # below restores the two static-IP host entries AFTER exaconf has written
    # /etc/hosts (a background loop that re-adds them if missing), so the VS
    # connection props http://minio:9000 and http://iceberg-rest:8181 resolve from
    # inside the UDF with NO manual patch. The static IPs match minio/iceberg-rest.
    # extra_hosts also sets the same entries at the Docker layer (intent + the brief
    # window before exaconf runs).
    extra_hosts:
      - "minio:10.84.0.10"
      - "iceberg-rest:10.84.0.11"
    entrypoint:
      - /bin/bash
      - -c
      - |
        ( while true; do
            if [ -f /etc/hosts ] && ! grep -qE '(^|[[:space:]])minio([[:space:]]|$)' /etc/hosts; then
              printf '10.84.0.10 minio\n10.84.0.11 iceberg-rest\n' >> /etc/hosts
            fi
            sleep 2
          done ) &
        exec "$(ls /opt/exasol/cos-*/docker/entrypoint.sh | head -1)" init-sc
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8563' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    networks:
      lakehouse:
        ipv4_address: 10.84.0.20

volumes:
  minio-data:
  exa-data:

networks:
  lakehouse:
    # Project-unique name + a dedicated subnet outside Docker's common 172.x
    # auto-pool, so this stack never collides with a generically-named
    # `lakehouse` network or the 172.21.x range a sibling stack might use.
    name: lakehouse-engine
    ipam:
      config:
        - subnet: 10.84.0.0/16
