# Unity Catalog OSS server config for the local Delta E2E stack (spike #325).
#
# Mounted into the container at /home/unitycatalog/etc/conf/server.properties by
# docker-compose.unity.yml. The image ships NO server.properties by default.
#
# Auth: left at the UC OSS default (server.authorization is OFF). Local E2E does
# not exercise the catalog auth path, so no token is required. To turn auth on
# later, set `server.authorization=enable` and the companion OAuth2 keys.
server.env=test

# --- S3 credential vending for the local MinIO `warehouse` bucket -------------
# The server matches a table's storage_location bucket against s3.bucketPath.<i>
# and vends the corresponding credential via POST
# /api/2.1/unity-catalog/temporary-table-credentials. `i` starts at 0.
#
# The credential itself is NOT configured here: `scripts/unity/seed.sh` mints a
# real MinIO STS session and injects it as `s3.accessKey.0`/`s3.secretKey.0`/
# `s3.sessionToken.0` in the container's environment, which UC reads in preference
# to this file. It has to be a genuine session, because a vended `session_token`
# is contractually one — the client must send it as `x-amz-security-token` — and
# MinIO rejects any token that is not a live STS session with 403 InvalidTokenId.
# A placeholder token therefore makes every vended read fail, and there is no
# credential UC can vend with no token at all: a non-empty `s3.sessionToken.<i>`
# is the ONLY switch into its per-bucket static generator (which then echoes the
# preset triple verbatim), and UC's own STS generator cannot substitute for it —
# the SDK it bundles ignores AWS_ENDPOINT_URL[_STS], so it calls the real
# sts.amazonaws.com rather than MinIO's STS endpoint.
#
# `s3.awsRoleArn.0` is deliberately unset: without it, a failed mint leaves the
# bucket with no vending entry at all (a loud, local FAILED_PRECONDITION) rather
# than routing UC into that real-AWS STS call.
#
# IMPORTANT (upstream issue #43): UC OSS 0.5.x has NO S3 endpoint-override key,
# so the vended response contains NO MinIO endpoint. The client (our engine's
# ObjectStore) injects the MinIO endpoint itself.
s3.bucketPath.0=s3://warehouse
s3.region.0=us-east-1
