sonar.projectKey=exasol-labs_lakehouse-engine-rs
sonar.organization=exasol-labs

# The WHOLE repository, not just `crates` — shell scripts, Terraform infra,
# CI YAML, Python, and SQL outside `crates/` were previously invisible to
# Sonar, including where its security rules bite hardest (Terraform, shell).
#
# No `sonar.exclusions` needed: the scanner applies SCM (git) exclusions by
# default, and the `sonar` job never builds, so `target/` doesn't exist in its
# workspace.
sonar.sources=.
sonar.tests=.
# `**/testdata/**` covers the golden fixtures under `crates/*/src/**/testdata/`
# (20 single-line `.sql` scan specs). They are neither `*_tests.rs` nor under
# `crates/*/tests/`, so without it the SQL sensor analyses them as production
# code: 13 embed `minioadmin` credentials, and all 20 are near-identical by
# construction — hardcoded-credential and duplication findings against a
# `qualitygate.wait=true` gate.
#
# `deploy/scripts/tests/**` is install.sh's bash test harness — production
# code without it.
#
# CAVEAT: this classifies files as tests for COVERAGE and DUPLICATION only, not
# for rule analysis. The first `main` scan raised rust:S3776 on
# capabilities_tests.rs and lib_tests.rs despite both matching `**/*_tests.rs`.
sonar.test.inclusions=**/*_tests.rs,crates/*/tests/**,**/testdata/**,deploy/scripts/tests/**

# Analysed for issues, but kept OUT of the coverage denominator: these are
# operational one-shot scripts (load generation, Spark queries) with no test
# suite, and no lcov report covers them. Shell/Terraform/YAML are safe to leave
# in — those analyzers emit no `lines_to_cover`, so they cannot dilute coverage.
# Python does, and is large enough on its own to push the Sonar way gate (80%)
# red.
sonar.coverage.exclusions=**/*.py

sonar.rust.lcov.reportPaths=lcov-unit.info

# The analyzer runs `cargo clippy` ITSELF unless this is false, and the scanner
# runner has no clippy for toolchain 1.94 — an ERROR every scan. Importing
# clippy diagnostics is a deliberate deferral (#310 "Out of scope"): it is a
# second data source with its own Quality Gate implications. Enabling it is a
# follow-up, via sonar.rust.clippy.reportPaths from the `lint` job.
sonar.rust.clippy.enabled=false

# Fail CI when the Quality Gate fails.
sonar.qualitygate.wait=true

# Accepted findings from the Lakekeeper work (#380), all already documented as deliberate
# tradeoffs in specs/_decision/084-add-lakekeeper-aws-perf-catalog.md's decision log — not
# silent gaps, just formally recorded here too so they stop failing new_security_rating.
sonar.issue.ignore.multicriteria=e1,e2,e3

# shell:S5332 "clear-text protocol" on bench/run.sh's build_conn_password_lakekeeper selftest:
# LAKEKEEPER_TOKEN_URI=http://token is a hardcoded literal used only to check the JSON-building
# logic includes the value verbatim — it is never resolved as a real network address.
sonar.issue.ignore.multicriteria.e1.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=bench/run.sh

# shell:S5332 on lakekeeper-up.sh's health-check curl calls: the Lakekeeper appliance box is
# intentionally reached over plain HTTP (no TLS on the box), bounded by the same IP-restricted
# security group (allowed_cidrs) the rest of deploy/ already uses, and torn down after each
# provisioning run — the accepted seam recorded in the PR's own decision log.
sonar.issue.ignore.multicriteria.e2.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e2.resourceKey=deploy/scripts/lakekeeper-up.sh

# terraform:S6329 "public network access" on the Lakekeeper EC2 instance's
# associate_public_ip_address: intentional (no aws_eip; the box's own boot script discovers its
# public IP via IMDSv2), reachable only from allowed_cidrs (default: the operator's own IP /32).
sonar.issue.ignore.multicriteria.e3.ruleKey=terraform:S6329
sonar.issue.ignore.multicriteria.e3.resourceKey=deploy/lakekeeper-stack/main.tf
