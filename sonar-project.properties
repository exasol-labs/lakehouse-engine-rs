sonar.projectKey=exasol-labs_lakehouse-engine-rs
sonar.organization=exasol-labs

# The WHOLE repository, not just `crates`. Everything outside it was previously
# invisible to Sonar: 27 shell scripts (5,831 lines, incl. the 1,262-line
# install.sh served straight off `main`), 12 Terraform files defining live AWS
# infra, 6 YAML (ci.yml itself), 3 Python, 5 SQL. Terraform and shell are where
# Sonar's security rules actually bite, so scoping them out defeated the point.
#
# No `sonar.exclusions` needed: the scanner applies SCM (git) exclusions by
# default, and the `sonar` job never builds — it checks out, downloads the lcov
# artifact and scans, so `target/` does not exist in its workspace at all.
sonar.sources=.
sonar.tests=.
# `**/testdata/**` covers the golden fixtures under `crates/*/src/**/testdata/`
# (20 single-line `.sql` scan specs). They are neither `*_tests.rs` nor under
# `crates/*/tests/`, so without it the SQL sensor analyses them as production
# code: 13 embed `minioadmin` credentials, and all 20 are near-identical by
# construction — hardcoded-credential and duplication findings against a
# `qualitygate.wait=true` gate.
#
# `deploy/scripts/tests/**` is install.sh's bash test harness — 1,749 lines,
# larger than install.sh itself. Production code without it.
#
# CAVEAT: this classifies files as tests for COVERAGE and DUPLICATION only, not
# for rule analysis. The first `main` scan raised rust:S3776 on
# capabilities_tests.rs and lib_tests.rs despite both matching `**/*_tests.rs`.
sonar.test.inclusions=**/*_tests.rs,crates/*/tests/**,**/testdata/**,deploy/scripts/tests/**

# Analysed for issues, but kept OUT of the coverage denominator: these are
# operational one-shot scripts (load generation, Spark queries) with no test
# suite, and no lcov report covers them. Shell/Terraform/YAML are safe to leave
# in — those analyzers emit no `lines_to_cover`, so they cannot dilute coverage.
# Python does. Measured at the time of writing: 7,024/8,385 covered = 83.8%,
# and the Sonar way gate fails below 80%, so the headroom is 395 uncovered
# lines. The three .py files are 444 lines (~357 non-blank, non-comment) — i.e.
# enough on their own to push the gate red.
sonar.coverage.exclusions=**/*.py

sonar.rust.lcov.reportPaths=lcov-unit.info

# The analyzer runs `cargo clippy` ITSELF unless this is false, and the scanner
# runner has no clippy for toolchain 1.94 — an ERROR every scan. Importing
# clippy diagnostics is a deliberate deferral (#310 "Out of scope"): it is a
# second data source with its own Quality Gate implications. Enabling it is a
# follow-up, via sonar.rust.clippy.reportPaths from the `lint` job.
sonar.rust.clippy.enabled=false

# Fail CI when the Quality Gate fails.
sonar.qualitygate.wait=true
