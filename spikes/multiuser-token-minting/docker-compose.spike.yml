# Spike stack for "adapter-minted tokens for per-user catalog authorization".
#
#   spikes/multiuser-token-minting/scripts/up.sh
#
# Self-contained: its own network (10.85.0.0/24), its own host ports, its own
# volumes. It deliberately does NOT layer onto docker-compose.yml — the spike
# needs Keycloak >= 26.2 (Standard Token Exchange V2) and OpenFGA, neither of
# which the E2E overlay has, and it must be able to run beside the E2E stack.
#
# Exasol is absent on purpose: options A/B/C/D are all reachable with curl
# against Keycloak + Lakekeeper + OpenFGA + MinIO. Exasol only matters for the
# optional phase-2 leg.
#
# --- identifiers this stack exposes -------------------------------------------
#   Keycloak realm .............. iceberg
#   Users ....................... alice / alice, bob / bob
#                                 (fixed UUIDs, see keycloak/realm-iceberg-spike.json)
#   Engine service account ...... client `lakehouse` / lakehouse-engine-secret
#   Engine, secret-less ......... client `lakehouse-jwt` (private_key_jwt, Option C)
#   Direct-grant client ......... `user-cli` (public, ROPC — genuine user tokens)
#   Engine issuer (Option A) .... http://engine-issuer:8090  (kid lakehouse-engine-1)
#   Lakekeeper catalog .......... http://lakekeeper:8181/catalog
#   Lakekeeper management ....... http://lakekeeper:8181/management/v1
#   OpenFGA ..................... http://openfga:8081 (grpc), :8080 (http)
#   MinIO ....................... http://minio:9000, warehouse bucket `warehouse`

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "${SPK_MINIO_PORT:-39000}:9000"
      - "${SPK_MINIO_CONSOLE_PORT:-39001}:9001"
    volumes:
      - spike-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      spike:
        ipv4_address: 10.85.0.10

  # Bucket + the scoped STS user Lakekeeper assumes from when vending
  # credentials (Option D). Same shape as the E2E stack's minio-lakekeeper-init.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/warehouse;
      printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\",\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::warehouse\",\"arn:aws:s3:::warehouse/*\"]}]}' > /tmp/p.json;
      mc admin policy create local lakekeeper-warehouse /tmp/p.json || true;
      mc admin user add local lakekeeper lakekeeper-secret-key || true;
      mc admin policy attach local lakekeeper-warehouse --user lakekeeper || true;
      echo 'minio ready'
      "
    restart: "no"
    networks:
      - spike

  # Option A's "trusted issuer": a static OIDC discovery document + JWKS for the
  # engine's own RSA key. Generated by scripts/gen-keys.sh into issuer/www/.
  engine-issuer:
    image: nginx:1.29-alpine
    volumes:
      - ./issuer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./issuer/www:/usr/share/nginx/html:ro
    ports:
      - "${SPK_ISSUER_PORT:-38090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/jwks.json | grep -q lakehouse-engine-1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 2s
    networks:
      spike:
        ipv4_address: 10.85.0.35

  # Keycloak >= 26.2: Standard Token Exchange V2. 26.4.0 additionally ships
  # `token-exchange-external-internal:v2`, which is the flag Option B needs;
  # both are enabled here so the spike can tell "not configured" from
  # "not supported".
  keycloak:
    image: "${SPK_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4.0}"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak/realm-iceberg-spike.json:/opt/keycloak/data/import/realm.json:ro
    command:
      - start-dev
      - --health-enabled=true
      - --metrics-enabled=true
      - --import-realm
      - --features=token-exchange-standard:v2,token-exchange-external-internal:v2,admin-fine-grained-authz:v2
      - --log-level=INFO
    # Probe the IMPORTED realm, not `master`: this gates dependents on realm
    # import finishing, not just on the server listening.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/127.0.0.1/8080;echo -e "GET /realms/iceberg/.well-known/openid-configuration HTTP/1.1\r\nhost: 127.0.0.1:8080\r\nConnection: close\r\n\r\n" >&3;grep "jwks_uri" <&3',
        ]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s
    depends_on:
      engine-issuer:
        condition: service_healthy
    ports:
      - "${SPK_KEYCLOAK_PORT:-38080}:8080"
    networks:
      spike:
        ipv4_address: 10.85.0.30

  # Option B-control ONLY. 26.0.7 is the last version in this spike's range that
  # still has legacy token exchange V1 (`token-exchange:v1` + FGAP v1), which is
  # what `requested_subject` impersonation needs. Not part of the default
  # bring-up set — scripts/option-b-control.sh starts it on demand.
  keycloak-legacy:
    image: "${SPK_KEYCLOAK_LEGACY_IMAGE:-quay.io/keycloak/keycloak:26.0.7}"
    profiles: ["legacy"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak/realm-iceberg-spike.json:/opt/keycloak/data/import/realm.json:ro
    command:
      - start-dev
      - --health-enabled=true
      - --import-realm
      - --features=token-exchange,admin-fine-grained-authz
      - --log-level=INFO
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/127.0.0.1/8080;echo -e "GET /realms/iceberg/.well-known/openid-configuration HTTP/1.1\r\nhost: 127.0.0.1:8080\r\nConnection: close\r\n\r\n" >&3;grep "jwks_uri" <&3',
        ]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s
    ports:
      - "${SPK_KEYCLOAK_LEGACY_PORT:-38081}:8080"
    networks:
      spike:
        ipv4_address: 10.85.0.36

  # Option B-control, second half. Same 26.4.0 image as `keycloak`, but running
  # LEGACY token exchange (`token-exchange:v1` + FGAP v1) instead of V2. Answers
  # "is the legacy path still reachable on >= 26.2, and on what terms?" without
  # confusing the V2 measurements next door — enabling v1 swaps out the provider
  # that handles every exchange, so the two cannot share one server.
  keycloak-v1:
    image: "${SPK_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4.0}"
    profiles: ["legacy"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak/realm-iceberg-spike.json:/opt/keycloak/data/import/realm.json:ro
    command:
      - start-dev
      - --health-enabled=true
      - --import-realm
      - --features=token-exchange,admin-fine-grained-authz:v1
      - --log-level=INFO
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/127.0.0.1/8080;echo -e "GET /realms/iceberg/.well-known/openid-configuration HTTP/1.1\r\nhost: 127.0.0.1:8080\r\nConnection: close\r\n\r\n" >&3;grep "jwks_uri" <&3',
        ]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s
    ports:
      - "${SPK_KEYCLOAK_V1_PORT:-38083}:8080"
    networks:
      spike:
        ipv4_address: 10.85.0.37

  openfga-db:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    volumes:
      - spike-openfga-db:/var/lib/postgresql/data
    networks:
      - spike

  openfga-migrate:
    image: &openfga-image openfga/openfga:v1.8.16
    command: migrate
    environment: &openfga-env
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:postgres@openfga-db:5432/postgres?sslmode=disable
      - OPENFGA_DATASTORE_MAX_OPEN_CONNS=50
      - OPENFGA_PLAYGROUND_ENABLED=false
    restart: "no"
    depends_on:
      openfga-db:
        condition: service_healthy
    networks:
      - spike

  openfga:
    image: *openfga-image
    command: run
    environment: *openfga-env
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    ports:
      - "${SPK_OPENFGA_HTTP_PORT:-38082}:8080"
    networks:
      spike:
        ipv4_address: 10.85.0.34

  lakekeeper-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    volumes:
      - spike-lakekeeper-db:/var/lib/postgresql/data
    networks:
      - spike

  # `migrate` also installs the OpenFGA authorization model, so it needs the same
  # AUTHZ_BACKEND/OPENFGA env as `serve` and must run after OpenFGA is healthy.
  lakekeeper-migrate:
    image: &lakekeeper-image "${SPK_LAKEKEEPER_IMAGE:-quay.io/lakekeeper/catalog:v0.13.1}"
    entrypoint: ["/home/nonroot/lakekeeper", "migrate"]
    environment: &lakekeeper-env
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__AUTHZ_BACKEND=openfga
      - LAKEKEEPER__OPENFGA__ENDPOINT=http://openfga:8081
      # Primary provider — Keycloak. Principals from it get user ids `oidc~<sub>`.
      - LAKEKEEPER__OPENID_PROVIDER_URI=http://keycloak:8080/realms/iceberg
      - "LAKEKEEPER__OPENID_ADDITIONAL_ISSUERS=http://localhost:${SPK_KEYCLOAK_PORT:-38080}/realms/iceberg"
      - LAKEKEEPER__OPENID_AUDIENCE=lakekeeper
      - LAKEKEEPER__OPENID_SUBJECT_CLAIM=sub
      # Option A — the engine as a SECOND trusted issuer, registered under the
      # IdP id `engine`. Principals from it get user ids `engine~<sub>`.
      - LAKEKEEPER__OPENID_PROVIDERS__ENGINE__URI=http://engine-issuer:8090
      - LAKEKEEPER__OPENID_PROVIDERS__ENGINE__AUDIENCE=lakekeeper
      - LAKEKEEPER__OPENID_PROVIDERS__ENGINE__SUBJECT_CLAIMS=sub
      - RUST_LOG=info,lakekeeper=debug
    restart: "no"
    depends_on:
      lakekeeper-db:
        condition: service_healthy
      openfga:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      engine-issuer:
        condition: service_healthy
    networks:
      - spike

  lakekeeper:
    image: *lakekeeper-image
    command: ["serve"]
    environment: *lakekeeper-env
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      lakekeeper-db:
        condition: service_healthy
      openfga:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      engine-issuer:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${SPK_LAKEKEEPER_PORT:-38181}:8181"
    networks:
      spike:
        ipv4_address: 10.85.0.32

networks:
  spike:
    name: spike-multiuser-token-minting
    ipam:
      config:
        - subnet: 10.85.0.0/24

volumes:
  spike-minio-data:
  spike-openfga-db:
  spike-lakekeeper-db:
