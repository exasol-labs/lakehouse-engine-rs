# Static OIDC issuer for the engine's own signing key.
#
# The adapter has no HTTP server, so what Option A has to answer is whether
# Lakekeeper can be handed a key some other way. It cannot: its authenticator
# takes a provider URI and runs OIDC discovery against it. This nginx stands in
# for whatever serves that pair of files in a real deployment (an S3/MinIO
# static website, a sidecar, the IdP itself).
server {
    listen 8090;
    server_name _;
    default_type application/json;
    charset utf-8;

    root /usr/share/nginx/html;

    location = /.well-known/openid-configuration {
        add_header Cache-Control "no-store";
        try_files /.well-known/openid-configuration =404;
    }
    location = /jwks.json {
        add_header Cache-Control "no-store";
        try_files /jwks.json =404;
    }
    location = /healthz { return 200 '{"status":"ok"}'; }

    # ---- Option B only -------------------------------------------------------
    # Keycloak's external->internal token exchange (V2) validates the external
    # token by POSTing it to the issuer's OAuth2 introspection endpoint, then
    # builds the identity from the issuer's userinfo endpoint. Neither is a
    # static document: both answer per token. These two stubs are hardcoded to
    # ALICE and validate nothing — they exist to show what the exchange demands
    # after the introspection URL is configured, not to be a usable design.
    location = /introspect {
        add_header Cache-Control "no-store";
        return 200 '{"active":true,"client_id":"lakehouse-engine","sub":"11111111-1111-4111-8111-111111111111","username":"alice","preferred_username":"alice","aud":["lakehouse-engine"],"iss":"http://engine-issuer:8090","token_type":"Bearer","exp":4102444800}';
    }
    location = /userinfo {
        add_header Cache-Control "no-store";
        return 200 '{"sub":"11111111-1111-4111-8111-111111111111","preferred_username":"alice","email":"alice@example.com","email_verified":true,"name":"Alice Anderson"}';
    }
}
